<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0C1C35">
<meta name="description" content="Kaporo — espace de travail sécurisé des programmes Kaporo 1 et Kaporo 2 (Conakry) : discussions, documents, décisions, phases, tâches.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kaporo">
<title>Kaporo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230C1C35'/%3E%3Cpath d='M16 48V16h8v14l14-14h10L32 32l17 16H38L24 34v14z' fill='%23C8992A'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230C1C35'/%3E%3Cpath d='M16 48V16h8v14l14-14h10L32 32l17 16H38L24 34v14z' fill='%23C8992A'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --encre:#0C1C35; --marine:#1E3A5F; --or:#C8992A; --or-fond:#FBF4E3; --laterite:#B4532A;
  --ivoire:#F4EFE4; --papier:#FFFFFF; --pierre:#6B6B6B; --trait:#DCD4C4; --grille:#ECE6DA; --texte:#0C1C35;
  --vert:#2E7D32; --vert-fond:#E6F2E7; --ambre:#C77700; --ambre-fond:#FFF1DC; --rouge:#B3261E; --rouge-fond:#FBE7E5; --bleu:#2F5A9E; --bleu-fond:#E4ECF7;
  --bulle-moi:#E3EFDC; --bulle-autre:#FFFFFF; --fond-chat:#EFE9DC;
  --serif:Georgia,"Times New Roman",serif; --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:.6em; --nav-w:15em; --top-h:3.4em; --tab-h:3.6em;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ivoire);color:var(--texte);font-family:var(--sans);font-size:clamp(14px,.95vw,16px);line-height:1.4;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%;display:block}
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;line-height:1.15}
a{color:var(--marine)}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--pierre)}
.sm{font-size:.86em}

/* ---- Connexion ---- */
#login{min-height:100%;display:grid;place-items:center;padding:1.5em;background:linear-gradient(160deg,var(--encre) 0%,var(--marine) 60%,#2b4f7e 100%)}
#login .boite{background:var(--papier);border-radius:1em;padding:1.8em 1.6em;width:min(26em,100%);box-shadow:0 20px 60px rgba(0,0,0,.35)}
#login .logo{width:3.2em;height:3.2em;border-radius:.7em;background:var(--encre);display:grid;place-items:center;margin-bottom:1em}
#login h1{font-size:1.9em;margin-bottom:.1em}
#login .sous{color:var(--pierre);margin-bottom:1.4em}
.champ{display:block;margin-bottom:.9em}
.champ span{display:block;font-size:.82em;font-weight:600;color:var(--pierre);margin-bottom:.3em}
.champ input,.champ select,.champ textarea{width:100%;border:1px solid var(--trait);border-radius:.5em;padding:.65em .8em;background:#fff}
.champ input:focus,.champ select:focus,.champ textarea:focus{outline:2px solid var(--or);border-color:var(--or)}
.msg{padding:.7em .9em;border-radius:.5em;font-size:.92em;margin:.8em 0}
.msg.ok{background:var(--vert-fond);color:var(--vert)}.msg.err{background:var(--rouge-fond);color:var(--rouge)}.msg.info{background:var(--bleu-fond);color:var(--bleu)}
.lien{background:none;border:0;color:var(--marine);text-decoration:underline;font-size:.9em;padding:.4em 0}

/* ---- Coquille ---- */
.app{display:grid;grid-template-columns:var(--nav-w) 1fr;grid-template-rows:auto 1fr;height:100dvh;overflow:hidden}
header.top{grid-column:1/-1;background:var(--encre);color:#fff;display:flex;align-items:center;gap:.8em;padding:.5em .9em;padding-top:calc(.5em + var(--sat));z-index:20}
.brand{display:flex;align-items:center;gap:.6em;min-width:0}
.brand .logo{width:2.2em;height:2.2em;border-radius:.5em;background:var(--or);color:var(--encre);font-family:var(--serif);font-weight:700;display:grid;place-items:center;font-size:1.05em;flex:none}
.brand b{font-family:var(--serif);font-weight:400;font-size:1.2em;display:block;line-height:1.1}
.brand small{opacity:.72;font-size:.78em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:.4em;padding:.2em .65em;border-radius:1em;font-size:.78em;font-weight:600;background:rgba(255,255,255,.12);white-space:nowrap}
.pill i{width:.55em;height:.55em;border-radius:50%;background:var(--pierre);display:inline-block}
.pill.on i{background:#5BD08A;box-shadow:0 0 0 3px rgba(91,208,138,.25)}
.pill.off i{background:var(--or)}
.avatar{width:2.1em;height:2.1em;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.85em;flex:none;letter-spacing:.02em}
nav.side{background:var(--papier);border-right:1px solid var(--trait);padding:.8em .6em;display:flex;flex-direction:column;gap:.15em;overflow:auto}
nav.side .grp{font-size:.72em;text-transform:uppercase;letter-spacing:.08em;color:var(--pierre);padding:.9em .7em .3em}
nav.side button{display:flex;align-items:center;gap:.6em;width:100%;text-align:left;background:none;border:0;padding:.6em .7em;border-radius:.45em;color:var(--texte)}
nav.side button:hover{background:var(--ivoire)}
nav.side button.on{background:var(--encre);color:#fff}
nav.side button .ic{width:1.3em;text-align:center;font-size:1.05em}
.bd{margin-left:auto;background:var(--rouge);color:#fff;font-size:.72em;border-radius:1em;padding:.1em .5em;font-weight:700;min-width:1.6em;text-align:center}
nav.side button.on .bd{background:var(--or);color:var(--encre)}
nav.tabs{display:none}
main{min-width:0;min-height:0;overflow:auto;padding:1.1em 1.3em 3em}
main.chat{padding:0;overflow:hidden}
.vue>h1{font-size:1.7em;margin-bottom:.15em}
.vue>.sous{color:var(--pierre);margin-bottom:1em;max-width:70ch}

/* ---- Composants ---- */
.g{display:grid;gap:1em}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.carte{background:var(--papier);border:1px solid var(--trait);border-radius:var(--r);padding:1em 1.1em;min-width:0}
.carte>h3{font-size:1.15em;margin-bottom:.6em;display:flex;justify-content:space-between;align-items:baseline;gap:.8em;flex-wrap:wrap}
.carte>h3 small{font-family:var(--sans);font-size:.72em;color:var(--pierre)}
.carte.accent{border-color:var(--or);background:var(--or-fond)}
.etat{font-size:.76em;font-weight:700;padding:.14em .6em;border-radius:1em;background:var(--vert-fond);color:var(--vert);white-space:nowrap}
.etat.ambre{background:var(--ambre-fond);color:var(--ambre)}.etat.rouge{background:var(--rouge-fond);color:var(--rouge)}.etat.bleu{background:var(--bleu-fond);color:var(--bleu)}.etat.gris{background:var(--grille);color:var(--pierre)}
.btn{border:1px solid var(--trait);background:var(--papier);padding:.55em 1em;border-radius:.45em;font-weight:600;display:inline-flex;align-items:center;gap:.45em;line-height:1.2}
.btn:hover{border-color:var(--marine)}
.btn.prim{background:var(--encre);color:#fff;border-color:var(--encre)}
.btn.or{background:var(--or);color:var(--encre);border-color:var(--or)}
.btn.rouge{background:var(--rouge);color:#fff;border-color:var(--rouge)}
.btn.sm{padding:.3em .7em;font-size:.86em}
.btn.bloc{width:100%;justify-content:center;padding:.75em}
.btn:disabled{opacity:.45;cursor:default}
.actions{display:flex;gap:.6em;flex-wrap:wrap;align-items:center}
.ligne{display:flex;justify-content:space-between;gap:1em;padding:.55em 0;border-top:1px solid var(--grille);font-size:.94em;align-items:center}
.ligne:first-child{border-top:0}
.ligne small{color:var(--pierre);display:block;font-size:.88em}
.filtres{display:flex;gap:.5em;flex-wrap:wrap;margin-bottom:1em}
.filtres button{border:1px solid var(--trait);background:var(--papier);border-radius:1em;padding:.3em .85em;font-size:.86em;font-weight:600}
.filtres button.on{background:var(--encre);color:#fff;border-color:var(--encre)}
.vide{color:var(--pierre);padding:1.5em;text-align:center;font-style:italic}
select.inline{border:1px solid var(--trait);border-radius:.4em;padding:.25em .4em;background:#fff;font-size:.86em}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + var(--sab) + 1em);transform:translateX(-50%);background:var(--encre);color:#fff;padding:.7em 1.1em;border-radius:.6em;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:50;font-size:.92em;max-width:90vw;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(12,28,53,.55);display:grid;place-items:end center;z-index:40;padding:0}
.modal .boite{background:var(--papier);border-radius:1em 1em 0 0;padding:1.2em 1.2em calc(1.2em + var(--sab));width:min(34em,100%);max-height:92dvh;overflow:auto}
.modal h3{font-size:1.25em;margin-bottom:.8em}
.phase{display:grid;grid-template-columns:2.2em 1fr auto;gap:.7em;padding:.7em 0;border-top:1px solid var(--grille);align-items:start}
.phase:first-child{border-top:0}
.phase .n{width:2em;height:2em;border-radius:50%;background:var(--grille);display:grid;place-items:center;font-weight:700;font-size:.85em;color:var(--pierre)}
.phase.encours .n{background:var(--or);color:var(--encre)}.phase.fait .n{background:var(--vert);color:#fff}
.phase b{display:block}
.phase small{color:var(--pierre);display:block;font-size:.86em}
.doc{display:grid;grid-template-columns:2.6em 1fr auto;gap:.7em;align-items:center;padding:.6em 0;border-top:1px solid var(--grille)}
.doc:first-child{border-top:0}
.doc .ic{width:2.6em;height:2.6em;border-radius:.5em;background:var(--bleu-fond);color:var(--bleu);display:grid;place-items:center;font-size:.8em;font-weight:700}
.doc b{display:block;overflow:hidden;text-overflow:ellipsis}
.doc small{color:var(--pierre);display:block;font-size:.85em}
.tache{display:grid;grid-template-columns:auto 1fr auto;gap:.7em;align-items:center;padding:.55em 0;border-top:1px solid var(--grille)}
.tache:first-child{border-top:0}
.tache input[type=checkbox]{width:1.3em;height:1.3em;accent-color:var(--vert)}
.tache.fait b{text-decoration:line-through;color:var(--pierre);font-weight:400}
.tache small{color:var(--pierre);display:block;font-size:.85em}
.tache.retard small{color:var(--rouge);font-weight:600}

/* ---- Discussions ---- */
.chat-wrap{display:grid;grid-template-columns:17em 1fr;height:100%;min-height:0}
.canaux{border-right:1px solid var(--trait);background:var(--papier);overflow:auto}
.canaux h2{font-size:1.1em;padding:1em 1em .5em}
.canal{display:flex;align-items:center;gap:.7em;width:100%;text-align:left;background:none;border:0;padding:.75em 1em;border-top:1px solid var(--grille)}
.canal:hover{background:var(--ivoire)}
.canal.on{background:var(--or-fond)}
.canal .ic{width:2.4em;height:2.4em;border-radius:50%;background:var(--encre);color:var(--or);display:grid;place-items:center;font-family:var(--serif);font-weight:700;flex:none}
.canal.gen .ic{background:var(--or);color:var(--encre)}
.canal b{display:block;font-weight:600}
.canal small{display:block;color:var(--pierre);font-size:.84em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:11em}
.canal .meta{margin-left:auto;text-align:right;font-size:.75em;color:var(--pierre);display:flex;flex-direction:column;align-items:flex-end;gap:.25em}
.canal .bd{margin:0}
.salon{display:flex;flex-direction:column;min-height:0;height:100%;background:var(--fond-chat)}
.salon .tete{display:flex;align-items:center;gap:.7em;padding:.6em .9em;background:var(--papier);border-bottom:1px solid var(--trait)}
.salon .tete .retour{display:none;background:none;border:0;font-size:1.3em;padding:.1em .3em}
.salon .tete b{display:block}
.salon .tete small{color:var(--pierre);font-size:.84em}
.fil{flex:1;overflow:auto;padding:.8em .9em;display:flex;flex-direction:column;gap:.25em;-webkit-overflow-scrolling:touch}
.jour{align-self:center;background:rgba(12,28,53,.08);color:var(--marine);font-size:.74em;font-weight:600;padding:.25em .8em;border-radius:1em;margin:.6em 0 .4em}
.bulle{max-width:min(78%,36em);background:var(--bulle-autre);border-radius:.8em;padding:.45em .7em .35em;box-shadow:0 1px 1px rgba(0,0,0,.08);position:relative;align-self:flex-start;word-wrap:break-word;overflow-wrap:anywhere}
.bulle.moi{align-self:flex-end;background:var(--bulle-moi);border-bottom-right-radius:.2em}
.bulle:not(.moi){border-bottom-left-radius:.2em}
.bulle .qui{font-size:.78em;font-weight:700;margin-bottom:.1em}
.bulle .txt{white-space:pre-wrap}
.bulle .txt a{word-break:break-all}
.bulle .quand{font-size:.68em;color:var(--pierre);text-align:right;margin-top:.15em;display:flex;gap:.4em;justify-content:flex-end;align-items:center}
.bulle .rep{border-left:3px solid var(--or);background:rgba(12,28,53,.05);padding:.3em .5em;border-radius:.3em;font-size:.82em;margin-bottom:.3em;color:var(--pierre);max-height:4em;overflow:hidden}
.bulle .rep b{display:block;color:var(--marine);font-size:.95em}
.bulle img.pj{border-radius:.5em;max-height:18em;object-fit:cover;margin:.2em 0;cursor:pointer;background:var(--grille);min-width:8em;min-height:3em}
.bulle .fichier{display:flex;align-items:center;gap:.6em;background:rgba(12,28,53,.06);border-radius:.5em;padding:.5em .6em;margin:.2em 0;text-decoration:none;color:var(--texte)}
.bulle .fichier .ic{width:2.2em;height:2.2em;border-radius:.4em;background:var(--encre);color:var(--or);display:grid;place-items:center;font-size:.7em;font-weight:700;flex:none}
.bulle .fichier b{display:block;font-size:.9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:14em}
.bulle .fichier small{color:var(--pierre);font-size:.78em}
.bulle.supprime .txt{font-style:italic;color:var(--pierre)}
.bulle.sel{outline:2px solid var(--or)}
.bulle-actions{align-self:center;display:flex;gap:.4em;margin:.2em 0 .4em;flex-wrap:wrap;justify-content:center}
.bulle-actions button{border:1px solid var(--trait);background:var(--papier);border-radius:1em;padding:.3em .8em;font-size:.82em;font-weight:600}
.systeme{align-self:center;font-size:.8em;color:var(--pierre);font-style:italic;margin:.3em 0}
.composer{background:var(--papier);border-top:1px solid var(--trait);padding:.5em .6em calc(.5em + var(--sab))}
.composer .repondre{display:flex;align-items:center;gap:.6em;border-left:3px solid var(--or);background:var(--or-fond);padding:.35em .6em;border-radius:.3em;font-size:.84em;margin-bottom:.4em}
.composer .repondre b{display:block;color:var(--marine)}
.composer .repondre span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--pierre)}
.composer .repondre button{background:none;border:0;font-size:1.1em;color:var(--pierre)}
.composer .pj-apercu{display:flex;align-items:center;gap:.6em;background:var(--bleu-fond);padding:.4em .6em;border-radius:.4em;font-size:.86em;margin-bottom:.4em}
.composer .pj-apercu img{width:3em;height:3em;object-fit:cover;border-radius:.3em}
.composer .pj-apercu span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.composer .pj-apercu button{background:none;border:0;font-size:1.1em}
.composer .barre{display:flex;align-items:flex-end;gap:.4em}
.composer textarea{flex:1;border:1px solid var(--trait);border-radius:1.2em;padding:.6em .9em;resize:none;max-height:9em;min-height:2.6em;line-height:1.35;background:#fff}
.composer textarea:focus{outline:2px solid var(--or);border-color:var(--or)}
.composer .rond{width:2.7em;height:2.7em;border-radius:50%;border:0;display:grid;place-items:center;font-size:1.1em;flex:none}
.composer .rond.pj{background:var(--grille);color:var(--marine)}
.composer .rond.env{background:var(--encre);color:var(--or)}
.composer .rond:disabled{opacity:.4}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:grid;place-items:center;z-index:60;padding:1em}
.lightbox img{max-width:100%;max-height:92dvh;object-fit:contain;border-radius:.3em}
.lightbox button{position:absolute;top:calc(.6em + var(--sat));right:.8em;background:rgba(255,255,255,.15);color:#fff;border:0;width:2.6em;height:2.6em;border-radius:50%;font-size:1.2em}

/* ---- Mobile ---- */
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  nav.side{display:none}
  nav.tabs{display:grid;grid-template-columns:repeat(6,1fr);background:var(--papier);border-top:1px solid var(--trait);padding:.25em 0 var(--sab);z-index:20}
  nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:.1em;padding:.35em 0;font-size:.58em;font-weight:600;color:var(--pierre);position:relative}
  nav.tabs button .ic{font-size:1.75em;line-height:1}
  nav.tabs button.on{color:var(--encre)}
  nav.tabs button .bd{position:absolute;top:0;right:12%;margin:0;font-size:.95em}
  main{padding:.9em .9em 2em}
  .g2,.g3{grid-template-columns:1fr}
  .brand small{display:none}
  .top .pill span{display:none}
  .chat-wrap{grid-template-columns:1fr}
  .chat-wrap.ouvert .canaux{display:none}
  .chat-wrap:not(.ouvert) .salon{display:none}
  .salon .tete .retour{display:block}
  .bulle{max-width:85%}
  .modal{place-items:end stretch}
  .modal .boite{width:100%}
}
@media (display-mode:standalone){header.top{padding-top:calc(.5em + var(--sat))}}
</style>
</head>
<body>
<div id="login">
  <div class="boite">
    <div class="logo"><svg width="30" height="30" viewBox="0 0 64 64"><path d="M16 48V16h8v14l14-14h10L32 32l17 16H38L24 34v14z" fill="#C8992A"/></svg></div>
    <h1>Kaporo</h1>
    <p class="sous">Espace de travail sécurisé — programmes Kaporo 1 et Kaporo 2, Conakry.</p>
    <form id="f-login" autocomplete="on">
      <label class="champ"><span>Votre adresse e-mail</span><input id="l-email" type="email" inputmode="email" autocomplete="email" placeholder="prenom@exemple.com" required></label>
      <label class="champ" id="l-pass-wrap" hidden><span>Mot de passe</span><input id="l-pass" type="password" autocomplete="current-password"></label>
      <div id="l-msg"></div>
      <button class="btn prim bloc" id="l-btn" type="submit">Recevoir mon lien de connexion</button>
      <button class="lien" type="button" id="l-toggle">J'ai déjà un mot de passe</button>
    </form>
    <p class="muted sm" style="margin-top:1em">Accès réservé aux membres invités. Le lien de connexion arrive par e-mail et reste valable une heure.</p>
  </div>
</div>

<div class="app" id="app" hidden>
  <header class="top">
    <div class="brand"><div class="logo">K</div><div><b>Kaporo</b><small>Kaporo 1 · Kaporo 2 — Conakry</small></div></div>
    <div class="spacer"></div>
    <span class="pill off" id="conn"><i></i><span>Connexion…</span></span>
    <div class="avatar" id="moi-avatar" title="">·</div>
  </header>
  <nav class="side" id="nav"></nav>
  <main id="main"></main>
  <nav class="tabs" id="tabs"></nav>
</div>
<div class="toast" id="toast"></div>
<div id="overlay"></div>
<script>
/* ============================================================
   Kaporo — noyau : configuration, état, utilitaires
   ============================================================ */
const SUPA = { url: 'https://opbxmnrtbzsxgwtfeemv.supabase.co', key: 'sb_publishable_UhCNYCizOEoofZ7_BiVs9g_7Z0wElT8', bucket: 'kp-files' };
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const hhmm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
const MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
function dateFr(x, opts = {}) {
  if (!x) return '—';
  const d = x instanceof Date ? x : new Date(x.length === 10 ? x + 'T12:00:00' : x);
  if (isNaN(d)) return '—';
  const s = d.getDate() + ' ' + MOIS[d.getMonth()] + (opts.annee === false ? '' : ' ' + d.getFullYear());
  return opts.jour ? JOURS[d.getDay()] + ' ' + s : s;
}
function jourRelatif(d) {
  const a = new Date(); a.setHours(0, 0, 0, 0);
  const b = new Date(d); b.setHours(0, 0, 0, 0);
  const diff = Math.round((a - b) / 86400000);
  if (diff === 0) return 'Aujourd’hui';
  if (diff === 1) return 'Hier';
  if (diff < 7) return JOURS[b.getDay()].replace(/^./, c => c.toUpperCase());
  return dateFr(b, { jour: true });
}
const octets = n => !n ? '' : n < 1024 ? n + ' o' : n < 1048576 ? (n / 1024).toFixed(0) + ' Ko' : (n / 1048576).toFixed(1) + ' Mo';
const initiales = n => (n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
function linkify(t) {
  return esc(t).replace(/(https?:\/\/[^\s<]+)/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
}
let toastT;
function toast(html, ms = 2600) { const t = $('#toast'); t.innerHTML = html; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms); }

/* Modale générique */
function modal(html, onMount) {
  const o = $('#overlay');
  o.innerHTML = `<div class="modal" id="modal"><div class="boite">${html}</div></div>`;
  const m = $('#modal');
  m.addEventListener('click', e => { if (e.target === m) fermerModal(); });
  if (onMount) onMount(m);
  return m;
}
function fermerModal() { $('#overlay').innerHTML = ''; }
function lightbox(src) {
  const o = $('#overlay');
  o.innerHTML = `<div class="lightbox" id="lb"><button aria-label="Fermer">✕</button><img src="${src}" alt=""></div>`;
  $('#lb').addEventListener('click', fermerModal);
}

/* Fichiers du coffre : URLs signées (1 h), mises en cache */
async function urlFichier(path) {
  const c = state.urls[path];
  if (c && c.exp > Date.now()) return c.url;
  const { data, error } = await state.client.storage.from(SUPA.bucket).createSignedUrl(path, 3600);
  if (error) throw error;
  state.urls[path] = { url: data.signedUrl, exp: Date.now() + 3300000 };
  return data.signedUrl;
}
async function televerser(file, dossier) {
  const nom = file.name.replace(/[^\w.\-]+/g, '_').slice(-80);
  const path = `${dossier}/${Date.now()}_${nom}`;
  const { error } = await state.client.storage.from(SUPA.bucket).upload(path, file, { contentType: file.type || 'application/octet-stream', upsert: false });
  if (error) throw error;
  return { path, name: file.name, mime: file.type, size: file.size };
}

/* ============================================================

   ============================================================ */
let modePass = false;
function msgLogin(type, html) { $('#l-msg').innerHTML = html ? `<div class="msg ${type}">${html}</div>` : ''; }
function expliquerErreur(e) {
  const m = (e && e.message) || String(e);
  if (/KAPORO_NOT_INVITED|Database error saving new user|Signups not allowed/i.test(m)) return 'Cette adresse n’est pas encore invitée. Demandez à Paul de vous ajouter dans l’onglet Équipe.';
  if (/Invalid login credentials/i.test(m)) return 'E-mail ou mot de passe incorrect.';
  if (/rate limit|security purposes/i.test(m)) return 'Trop de demandes en peu de temps. Patientez une minute puis réessayez.';
  if (/Email not confirmed/i.test(m)) return 'Adresse non confirmée : cliquez d’abord sur le lien reçu par e-mail.';
  return 'Connexion impossible : ' + esc(m);
}
function initLogin() {
  $('#l-toggle').addEventListener('click', () => {
    modePass = !modePass;
    $('#l-pass-wrap').hidden = !modePass;
    $('#l-btn').textContent = modePass ? 'Se connecter' : 'Recevoir mon lien de connexion';
    $('#l-toggle').textContent = modePass ? 'Recevoir plutôt un lien par e-mail' : 'J’ai déjà un mot de passe';
    msgLogin('', '');
  });
  $('#f-login').addEventListener('submit', async e => {
    e.preventDefault();
    const email = $('#l-email').value.trim().toLowerCase();
    const btn = $('#l-btn'); btn.disabled = true; msgLogin('info', 'Un instant…');
    try {
      if (modePass) {
        const { error } = await state.client.auth.signInWithPassword({ email, password: $('#l-pass').value });
        if (error) throw error;
        msgLogin('', '');
      } else {
        const redirect = location.origin + location.pathname;
        const { error } = await state.client.auth.signInWithOtp({ email, options: { emailRedirectTo: redirect, shouldCreateUser: true } });
        if (error) throw error;
        msgLogin('ok', `<b>Lien envoyé à ${esc(email)}.</b><br>Ouvrez l’e-mail sur cet appareil et touchez le lien pour entrer. Pensez à vérifier les courriers indésirables.`);
      }
    } catch (err) { msgLogin('err', expliquerErreur(err)); }
    btn.disabled = false;
  });
}
async function definirMotDePasse(pw) {
  const { error } = await state.client.auth.updateUser({ password: pw });
  if (error) throw error;
}
async function deconnecter() { await state.client.auth.signOut(); location.reload(); }

const msgsCanal = id => state.messages.filter(m => m.channel_id === id);
function nonLus(id) {

  return msgsCanal(id).filter(m => m.author !== state.moi.user_id && new Date(m.created_at).getTime() > lu).length;
}
const totalNonLus = () => state.canaux.reduce((s, c) => s + nonLus(c.id), 0);
function resumeMessage(m) {
  if (!m) return 'Aucun message';
  if (m.deleted) return 'Message supprimé';
  const a = m.attachment;
  const pj = a ? (a.mime?.startsWith('image/') ? '📷 Photo' : '📎 ' + a.name) : '';

function renderCanaux() {

function ouvrirCanal(id) {

function fermerSalon() { state.salonOuvert = false; $('#chat')?.classList.remove('ouvert'); renderCanaux(); }

function renderSalon() {

  const c = state.canaux.find(x => x.id === state.canal);
  if (!c) { s.innerHTML = '<div class="vide">Choisissez une discussion.</div>'; return; }

      <span class="avatar" style="background:${c.kind === 'general' ? 'var(--or)' : 'var(--encre)'};color:${c.kind === 'general' ? 'var(--encre)' : 'var(--or)'}">${c.kind === 'general' ? '✦' : c.name.replace(/\D/g, '') || c.name[0]}</span>
      <div><b>${esc(c.name)}</b><small>${state.membres.map(m => m.name.split(' ')[0]).join(', ')}</small></div></div>

}
function renderFil(garderScroll) {
  const fil = $('#fil'); if (!fil) return;
  const ms = msgsCanal(state.canal);
  const enBas = !garderScroll || fil.scrollHeight - fil.scrollTop - fil.clientHeight < 120;
  let jour = ''; const out = [];
  if (!ms.length) out.push('<div class="systeme">Début de la discussion. Écrivez le premier message.</div>');
  for (const m of ms) {
    const j = jourRelatif(m.created_at);
    if (j !== jour) { out.push(`<div class="jour">${j}</div>`); jour = j; }
    out.push(bulle(m));
    if (state.selection === m.id) out.push(actionsBulle(m));
  }
  fil.innerHTML = out.join('');
  $$('.bulle', fil).forEach(b => b.addEventListener('click', e => {
    if (e.target.closest('a,img')) return;
    state.selection = state.selection === b.dataset.id ? null : b.dataset.id; renderFil(true);
  }));
  $$('img.pj', fil).forEach(img => { chargerImage(img); img.addEventListener('click', () => img.src && img.dataset.ok && lightbox(img.src)); });
  $$('a.fichier', fil).forEach(a => a.addEventListener('click', async e => { e.preventDefault(); try { window.open(await urlFichier(a.dataset.path), '_blank'); } catch (err) { toast('Fichier indisponible'); } }));
  $$('.bulle-actions button', fil).forEach(b => b.addEventListener('click', e => { e.stopPropagation(); actionMessage(b.dataset.act, b.dataset.id); }));
  if (enBas) fil.scrollTop = fil.scrollHeight;
}
function bulle(m) {
  const moi = m.author === state.moi.user_id; const a = membre(m.author);
  let corps = '';
  if (m.deleted) corps = '<div class="txt">Message supprimé</div>';
  else {
    if (m.reply_to) { const r = state.messages.find(x => x.id === m.reply_to); corps += `<div class="rep"><b>${esc(r ? membre(r.author).name : 'Message')}</b>${esc(resumeMessage(r))}</div>`; }
    if (m.attachment) {
      const p = m.attachment;
      corps += p.mime?.startsWith('image/') ? `<img class="pj" data-path="${esc(p.path)}" alt="${esc(p.name)}">`
        : `<a class="fichier" href="#" data-path="${esc(p.path)}"><span class="ic">${esc((p.name.split('.').pop() || 'DOC').slice(0, 4).toUpperCase())}</span><span><b>${esc(p.name)}</b><small>${octets(p.size)}</small></span></a>`;
    }
    if (m.body) corps += `<div class="txt">${linkify(m.body)}</div>`;
  }
  return `<div class="bulle ${moi ? 'moi' : ''} ${m.deleted ? 'supprime' : ''} ${state.selection === m.id ? 'sel' : ''}" data-id="${m.id}">
    ${moi ? '' : `<div class="qui" style="color:${a.color}">${esc(a.name)}</div>`}${corps}
    <div class="quand">${m.edited_at ? '<span>modifié</span>' : ''}<span>${hhmm(new Date(m.created_at))}</span></div></div>`;
}
function actionsBulle(m) {
  const moi = m.author === state.moi.user_id;
  return `<div class="bulle-actions">
    <button data-act="repondre" data-id="${m.id}">↩ Répondre</button>
    ${m.body ? `<button data-act="copier" data-id="${m.id}">Copier</button>` : ''}
    ${m.attachment && !m.deleted ? `<button data-act="coffre" data-id="${m.id}">Classer dans Documents</button>` : ''}
    ${moi && !m.deleted ? `<button data-act="supprimer" data-id="${m.id}">Supprimer</button>` : ''}</div>`;
}
async function chargerImage(img) {
  try { img.src = await urlFichier(img.dataset.path); img.dataset.ok = '1'; } catch (e) { img.alt = 'Image indisponible'; }
}
async function actionMessage(act, id) {
  const m = state.messages.find(x => x.id === id); if (!m) return;
  state.selection = null;
  if (act === 'repondre') { state.reponseA = m; renderFil(true); renderComposer(); $('#txt')?.focus(); return; }
  if (act === 'copier') { try { await navigator.clipboard.writeText(m.body); toast('Texte copié'); } catch (e) { } renderFil(true); return; }
  if (act === 'supprimer') {
    const { error } = await state.client.from('kp_messages').update({ deleted: true, body: '', attachment: null }).eq('id', id);
    if (error) toast('Suppression impossible'); else { m.deleted = true; m.body = ''; m.attachment = null; }
    renderFil(true); renderCanaux(); return;
  }
  if (act === 'coffre') { renderFil(true); classerPieceJointe(m); }
}
function classerPieceJointe(m) {
  const p = m.attachment; const c = state.canaux.find(x => x.id === m.channel_id);
  modal(`<h3>Classer dans Documents</h3>
    <label class="champ"><span>Titre</span><input id="d-titre" value="${esc(p.name.replace(/\.[^.]+$/, ''))}"></label>
    <label class="champ"><span>Projet</span><select id="d-projet">${optionsProjets(c?.project_id)}</select></label>
    <label class="champ"><span>Catégorie</span><select id="d-cat">${CATEGORIES.map(x => `<option>${x}</option>`).join('')}</select></label>

function renderComposer() {
  const c = $('#composer'); if (!c) return;
  const r = state.reponseA; const pj = state.pj;
  c.innerHTML = `${r ? `<div class="repondre"><div><b>${esc(membre(r.author).name)}</b><span>${esc(resumeMessage(r))}</span></div><button id="rep-x" aria-label="Annuler">✕</button></div>` : ''}
    ${pj ? `<div class="pj-apercu">${pj.type.startsWith('image/') ? `<img src="${pj.url}" alt="">` : '📎'}<span>${esc(pj.file.name)} · ${octets(pj.file.size)}</span><button id="pj-x" aria-label="Retirer">✕</button></div>` : ''}
    <div class="barre"><input type="file" id="pj-input" hidden accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.dwg,.dxf,.zip,.txt">
      <button class="rond pj" id="pj-btn" title="Joindre une photo ou un fichier">📎</button>
      <textarea id="txt" rows="1" placeholder="Écrire un message…" enterkeyhint="send"></textarea>
      <button class="rond env" id="env" title="Envoyer">➤</button></div>`;
  const txt = $('#txt', c);
  txt.addEventListener('input', () => { txt.style.height = 'auto'; txt.style.height = Math.min(txt.scrollHeight, 150) + 'px'; });
  txt.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(min-width:821px)').matches) { e.preventDefault(); envoyer(); } });
  $('#env', c).addEventListener('click', envoyer);
  $('#pj-btn', c).addEventListener('click', () => $('#pj-input').click());
  $('#pj-input', c).addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    if (f.size > 50 * 1048576) { toast('Fichier trop lourd (50 Mo maximum)'); return; }
    state.pj = { file: f, type: f.type || '', url: f.type.startsWith('image/') ? URL.createObjectURL(f) : null };
    const v = txt.value; renderComposer(); $('#txt').value = v; $('#txt').focus();
  });
  $('#rep-x', c)?.addEventListener('click', () => { state.reponseA = null; const v = txt.value; renderComposer(); $('#txt').value = v; });
  $('#pj-x', c)?.addEventListener('click', () => { state.pj = null; const v = txt.value; renderComposer(); $('#txt').value = v; });
}
let envoiEnCours = false;
async function envoyer() {
  if (envoiEnCours) return;
  const txt = $('#txt'); const body = txt.value.trim();
  if (!body && !state.pj) return;
  envoiEnCours = true; $('#env').disabled = true;
  try {
    let attachment = null;
    if (state.pj) { toast('Envoi du fichier…', 8000); attachment = await televerser(state.pj.file, 'chat/' + state.canal); }
    const row = { channel_id: state.canal, author: state.moi.user_id, body, attachment, reply_to: state.reponseA?.id || null };
    const { data, error } = await state.client.from('kp_messages').insert(row).select().single();
    if (error) throw error;
    if (!state.messages.find(m => m.id === data.id)) state.messages.push(data);
    state.reponseA = null; state.pj = null; txt.value = ''; txt.style.height = 'auto';
    renderComposer(); renderFil(); renderCanaux(); marquerLu(state.canal); $('#txt').focus();
    $('#toast').classList.remove('on');
  } catch (e) { console.error(e); toast('<b>Envoi impossible.</b> Vérifiez la connexion.'); }
  envoiEnCours = false; const b = $('#env'); if (b) b.disabled = false;
}
async function marquerLu(id) {
  const now = new Date().toISOString(); state.lectures[id] = now; renderNav();
  await state.client.from('kp_reads').upsert({ user_id: state.moi.user_id, channel_id: id, last_read: now });
}
function messageRecu(m) {
  const i = state.messages.findIndex(x => x.id === m.id);
  if (i >= 0) state.messages[i] = m; else state.messages.push(m);
  state.messages.sort((a, b) => a.created_at < b.created_at ? -1 : 1);
  const visible = state.vue === 'discussions' && state.canal === m.channel_id && (state.salonOuvert || window.matchMedia('(min-width:821px)').matches) && document.visibilityState === 'visible';
  if (visible) { renderFil(true); marquerLu(m.channel_id); }
  if (state.vue === 'discussions') renderCanaux();
  renderNav();
  if (i < 0 && m.author !== state.moi.user_id) {
    const a = membre(m.author); const c = state.canaux.find(x => x.id === m.channel_id);
    if (!visible) toast(`<b>${esc(a.name)}</b> · ${esc(c?.name || '')}<br>${esc(resumeMessage(m))}`);
    if (document.visibilityState !== 'visible' && 'Notification' in window && Notification.permission === 'granted') {
      try { new Notification(a.name + ' · ' + (c?.name || 'Kaporo'), { body: resumeMessage(m), tag: m.id }); } catch (e) { }
    }
  }
}

function carteProjet(p) {
  const phases = state.phases.filter(x => x.project_id === p.id).sort((a, b) => a.num - b.num);
  const faites = phases.filter(x => x.status === 'terminée').length;
  const docs = state.documents.filter(d => d.project_id === p.id).length;
  const taches = state.taches.filter(t => t.project_id === p.id && t.status !== 'fait').length;
  return `<div class="carte"><h3>${esc(p.name)} <span class="etat ${classeStatut(p.status)}">${esc(p.status)}</span></h3>
    <p class="muted sm" style="margin-bottom:.6em">${esc(p.subtitle || '')}${p.surface_m2 ? ` · <b class="num">${p.surface_m2.toLocaleString('fr-FR')} m²</b>` : ''}</p>
    <p class="sm" style="margin-bottom:.6em">${phases.length ? `${faites}/${phases.length} phases terminées` : 'Aucune phase définie'} · ${docs} document${docs > 1 ? 's' : ''} · ${taches} tâche${taches > 1 ? 's' : ''} ouverte${taches > 1 ? 's' : ''}</p>
    ${phases.length ? phases.map(ph => `<div class="phase ${ph.status === 'en cours' ? 'encours' : ph.status === 'terminée' ? 'fait' : ''}"><span class="n">${ph.num}</span>
        <div><b>${esc(ph.title)}</b><small>${ph.start_on ? dateFr(ph.start_on) : '—'} → ${ph.end_on ? dateFr(ph.end_on) : 'en continu'}</small><small>${esc(ph.deliverable || '')}</small></div>
        <select class="inline" data-phase="${ph.id}">${STATUTS_PHASE.map(s => `<option ${s === ph.status ? 'selected' : ''}>${s}</option>`).join('')}</select></div>`).join('')
      : '<div class="vide">Les phases seront définies après la visite du second terrain.</div>'}</div>`;
}

function ligneDoc(d) {

function formDocument() {

const STATUTS_DEV = { 'envoyée': ['bleu', 'Transmise'], 'en cours': ['ambre', 'En cours'], 'question': ['ambre', 'Question'], 'livrée': ['', 'Livrée'], 'abandonnée': ['gris', 'Abandonnée'], 'erreur': ['rouge', 'Erreur'] };
async function chargerDev() {
  const { data, error } = await state.client.from('kp_dev_requests').select('*').order('created_at', { ascending: false });
  if (!error) state.dev = data || [];
}
async function vueDev() {
  const main = $('#main'); main.className = '';
  if (!state.moi.is_admin) { main.innerHTML = '<div class="vide">Module réservé à l’administrateur.</div>'; return; }
  if (!state.dev) await chargerDev();
  const ouvertes = state.dev.filter(d => !['livrée', 'abandonnée'].includes(d.status));
  const closes = state.dev.filter(d => ['livrée', 'abandonnée'].includes(d.status));
  main.innerHTML = `<div class="vue"><h1>Développement</h1><p class="sous">Décrivez une modification ou un ajustement de l’application. La demande part automatiquement vers l’agent Claude, qui la réalise, publie la nouvelle version et vous répond ici. Comptez quelques minutes.</p>

      <div class="carte accent"><h3>Nouvelle demande</h3>
        <label class="champ"><span>En une ligne</span><input id="dv-titre" placeholder="Ex. Ajouter un filtre par membre dans Tâches"></label>

        <button class="btn prim" id="dv-ok">Envoyer à Claude</button>

      <div class="carte"><h3>En cours <small>${ouvertes.length}</small></h3>${ouvertes.length ? ouvertes.map(carteDev).join('') : '<div class="vide">Aucune demande en cours.</div>'}</div>
    </div>
    <div class="carte" style="margin-top:1em"><h3>Historique <small>${closes.length}</small></h3>${closes.length ? closes.map(carteDev).join('') : '<div class="vide">Rien encore.</div>'}</div>
    ${await carteReglagesDev()}</div>`;
  $('#dv-ok').addEventListener('click', envoyerDev);
  $('#dvs-ok').addEventListener('click', enregistrerReglagesDev);
  $$('[data-dv-rep]').forEach(b => b.addEventListener('click', () => repondreDev(b.dataset.dvRep)));
  $$('[data-dv-stop]').forEach(b => b.addEventListener('click', async () => {

  }));

function carteDev(d) {
  const [cls, lib] = STATUTS_DEV[d.status] || ['gris', d.status];
  const fil = (d.thread || []).map(t => `<div class="evt ${t.who === 'claude' ? 'bleu' : ''}" style="grid-template-columns:auto 1fr;gap:.7em"><span class="s" style="min-width:3.2em">${t.who === 'claude' ? 'Claude' : 'Vous'}</span><span style="white-space:pre-wrap">${esc(t.text)}<small class="d">${dateFr(t.at)} ${hhmm(new Date(t.at))}</small></span></div>`).join('');
  return `<div class="ligne" style="display:block"><div style="display:flex;justify-content:space-between;gap:.8em;align-items:center"><b>${esc(d.title)}</b><span class="etat ${cls}">${lib}</span></div>
    <small>${dateFr(d.created_at)} ${hhmm(new Date(d.created_at))}${d.commit_sha ? ' · version ' + esc(d.commit_sha.slice(0, 7)) : ''}</small>
    ${d.detail ? `<p class="sm" style="white-space:pre-wrap;margin:.4em 0">${esc(d.detail)}</p>` : ''}
    ${fil ? `<div style="margin:.5em 0">${fil}</div>` : ''}
    <div class="actions" style="margin-top:.5em">
      ${d.status === 'livrée' ? '<button class="btn sm or" data-dv-reload>Recharger l’application</button>' : ''}
      ${['question', 'livrée', 'erreur'].includes(d.status) ? `<button class="btn sm" data-dv-rep="${d.id}">${d.status === 'question' ? 'Répondre' : 'Demander un ajustement'}</button>` : ''}
      ${!['livrée', 'abandonnée'].includes(d.status) ? `<button class="btn sm" data-dv-stop="${d.id}">Abandonner</button>` : ''}
    </div></div>`;
}
async function envoyerDev() {
  const title = $('#dv-titre').value.trim(); const detail = $('#dv-detail').value.trim();
  if (!title) { toast('Décrivez la demande en une ligne'); return; }
  const btn = $('#dv-ok'); btn.disabled = true;
  try {
    let attachment = null; const f = $('#dv-file').files[0];
    if (f) { toast('Envoi de la capture…', 8000); attachment = await televerser(f, 'dev'); }
    const { error } = await state.client.from('kp_dev_requests').insert({ title, detail: detail || null, attachment, thread: [], created_by: state.moi.user_id });
    if (error) throw error;
    await chargerDev(); vueDev(); toast('<b>Demande transmise à Claude.</b> Vous serez prévenu ici.');
  } catch (e) { console.error(e); toast('Envoi impossible : ' + esc(e.message || '')); btn.disabled = false; }
}
function repondreDev(id) {
  const d = state.dev.find(x => x.id === id); if (!d) return;
  modal(`<h3>${d.status === 'question' ? 'Répondre à Claude' : 'Demander un ajustement'}</h3>
    <p class="sm muted" style="margin-bottom:.6em">${esc(d.title)}</p>
    <label class="champ"><span>Votre message</span><textarea id="dv-msg" rows="5"></textarea></label>
    <div class="actions"><button class="btn prim" id="dv-msg-ok">Envoyer</button><button class="btn" onclick="fermerModal()">Annuler</button></div>`, mo => {
    $('#dv-msg-ok', mo).addEventListener('click', async () => {
      const text = $('#dv-msg').value.trim(); if (!text) return;
      const thread = (d.thread || []).concat([{ who: 'paul', text, at: new Date().toISOString() }]);
      const { error } = await state.client.from('kp_dev_requests').update({ thread, status: 'envoyée' }).eq('id', id);
      if (error) { toast('Envoi impossible'); return; }
      fermerModal(); await chargerDev(); vueDev(); toast('Message transmis à Claude');
    });
  });
}

/* Réglages du module Développement : secret partagé et jeton GitHub (saisis par l'administrateur, jamais relus) */
async function carteReglagesDev() {
  let etat = {}; let journal = [];
  try { const { data } = await state.client.rpc('kp_dev_settings_state'); etat = data || {}; } catch (e) { }
  try { const { data } = await state.client.rpc('kp_dev_dispatch_log'); journal = data || []; } catch (e) { }
  const ok = k => etat[k] ? '<span class="etat">renseigné</span>' : '<span class="etat rouge">manquant</span>';
  const j = journal.length ? `<p class="sm muted" style="margin-top:.8em">Derniers signaux envoyés à GitHub : ${journal.map(x => `<span class="etat ${x.status >= 200 && x.status < 300 ? '' : 'rouge'}">${x.status || 'erreur'}</span>`).join(' ')}</p>` : '';
  return `<div class="carte" style="margin-top:1em"><h3>Liaison avec l’agent Claude</h3>
    <p class="sm muted" style="margin-bottom:.8em">Deux valeurs relient ce module à la routine Claude sur claude.ai. Elles sont stockées côté serveur, jamais réaffichées. Laissez un champ vide pour ne pas le modifier.</p>
    <label class="champ"><span>Secret partagé ${ok('dev_secret')}</span><input id="dvs-secret" type="password" autocomplete="off" placeholder="Phrase longue, la même que KP_DEV_SECRET sur claude.ai"></label>
    <label class="champ"><span>Jeton GitHub ${ok('github_token')}</span><input id="dvs-token" type="password" autocomplete="off" placeholder="Jeton à granularité fine, dépôt Byande/kaporo, Contents : lecture et écriture"></label>
    <button class="btn sm" id="dvs-ok">Enregistrer</button>${j}</div>`;
}
async function enregistrerReglagesDev() {
  const s = $('#dvs-secret').value; const g = $('#dvs-token').value.trim();
  try {
    if (s) { const { error } = await state.client.rpc('kp_dev_set_setting', { k: 'dev_secret', v: s }); if (error) throw error; }
    if (g) { const { error } = await state.client.rpc('kp_dev_set_setting', { k: 'github_token', v: g }); if (error) throw error; }
    toast('Réglages enregistrés'); vueDev();
  } catch (e) { toast('Enregistrement impossible : ' + esc(e.message || '')); }
}

/* ============================================================
   Navigation, chargement des données, temps réel, démarrage
   ============================================================ */
const VUES = [
  ['discussions', '💬', 'Discussions', vueDiscussions], ['projets', '🏗️', 'Projets', vueProjets], ['documents', '📁', 'Documents', vueDocuments],
  ['decisions', '✅', 'Décisions', vueDecisions], ['taches', '☑️', 'Tâches', vueTaches], ['equipe', '👥', 'Équipe', vueEquipe],
  ['dev', '🛠️', 'Développement', vueDev, 'admin'],
];
const vuesVisibles = () => VUES.filter(v => !v[4] || (state.moi && state.moi.is_admin));
function renderNav() {
  const nl = totalNonLus(); const auj = new Date().toISOString().slice(0, 10);
  const retard = state.taches.filter(t => t.status !== 'fait' && t.due_on && t.due_on < auj).length;
  const badge = k => k === 'discussions' && nl ? `<span class="bd">${nl}</span>` : k === 'taches' && retard ? `<span class="bd">${retard}</span>` : '';
  const devOuv = (state.dev || []).filter(d => ['question', 'livrée'].includes(d.status) && !d.vu).length;
  const btn = (k, court) => `<button class="${state.vue === k[0] ? 'on' : ''}" data-v="${k[0]}"><span class="ic">${k[1]}</span><span>${court && k[2] === 'Développement' ? 'Dév.' : k[2]}</span>${badge(k[0])}</button>`;
  const vs = vuesVisibles();
  $('#nav').innerHTML = `<div class="grp">Espace de travail</div>${vs.map(k => btn(k, false)).join('')}`;
  $('#tabs').innerHTML = vs.map(k => btn(k, true)).join('');
  $('#tabs').style.gridTemplateColumns = `repeat(${vs.length},1fr)`;
  $$('#nav button,#tabs button').forEach(b => b.addEventListener('click', () => go(b.dataset.v)));
  const a = $('#moi-avatar'); if (state.moi) { a.textContent = initiales(state.moi.name); a.style.background = state.moi.color; a.title = state.moi.name; }
  document.title = (nl ? `(${nl}) ` : '') + 'Kaporo';
}
function go(v) {
  state.vue = v; localStorage.setItem('kp.vue', v); fermerModal();
  const def = VUES.find(x => x[0] === v) || VUES[0];
  renderNav(); def[3]();
}
function setConn(ok, lib) { const c = $('#conn'); c.className = 'pill ' + (ok ? 'on' : 'off'); c.innerHTML = '<i></i><span>' + (lib || (ok ? 'En direct' : 'Hors ligne')) + '</span>'; }

async function chargerTout() {
  const c = state.client;
  const [me, mb, pr, ch, ms, rd, dc, de, ph, ta] = await Promise.all([
    c.from('kp_members').select('*').eq('user_id', state.session.user.id).maybeSingle(),
    c.from('kp_members').select('*').order('created_at'),
    c.from('kp_projects').select('*').order('sort'),
    c.from('kp_channels').select('*').order('sort'),
    c.from('kp_messages').select('*').order('created_at', { ascending: true }).limit(2000),
    c.from('kp_reads').select('*').eq('user_id', state.session.user.id),
    c.from('kp_documents').select('*').order('created_at', { ascending: false }),
    c.from('kp_decisions').select('*').order('decided_on', { ascending: false }),
    c.from('kp_phases').select('*').order('num'),
    c.from('kp_tasks').select('*').order('created_at'),
  ]);
  const err = [me, mb, pr, ch, ms, rd, dc, de, ph, ta].find(r => r.error); if (err) throw err.error;
  if (!me.data) throw new Error('PROFIL_ABSENT');
  state.moi = me.data; state.membres = mb.data; state.projets = pr.data; state.canaux = ch.data; state.messages = ms.data;
  state.lectures = Object.fromEntries((rd.data || []).map(r => [r.channel_id, r.last_read]));
  state.documents = dc.data; state.decisions = de.data; state.phases = ph.data; state.taches = ta.data;
}
function brancherTempsReel() {
  const c = state.client;
  const maj = (table, cle, tri) => async payload => {
    const row = payload.new?.id ? payload.new : null;
    if (payload.eventType === 'DELETE') { state[cle] = state[cle].filter(x => x.id !== payload.old.id); }
    else if (row) { const i = state[cle].findIndex(x => x.id === row.id); if (i >= 0) state[cle][i] = row; else state[cle].push(row); if (tri) state[cle].sort(tri); }
    if (!document.activeElement?.matches('input,select,textarea') && state.vue !== 'discussions') go(state.vue); else renderNav();
  };
  c.channel('kaporo-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'kp_messages' }, p => { if (p.new?.id) messageRecu(p.new); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'kp_tasks' }, maj('kp_tasks', 'taches'))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'kp_decisions' }, maj('kp_decisions', 'decisions', (a, b) => b.decided_on.localeCompare(a.decided_on)))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'kp_documents' }, maj('kp_documents', 'documents', (a, b) => b.created_at.localeCompare(a.created_at)))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'kp_phases' }, maj('kp_phases', 'phases', (a, b) => a.num - b.num))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'kp_dev_requests' }, async p => {
      if (!state.moi?.is_admin) return; await chargerDev();
      if (p.new && ['question', 'livrée', 'erreur'].includes(p.new.status) && p.old?.status !== p.new.status) toast(`<b>Claude · ${esc(p.new.title)}</b><br>${p.new.status === 'livrée' ? 'Livrée : rechargez l’application pour voir le résultat.' : p.new.status === 'question' ? 'Claude a une question.' : 'Erreur pendant la réalisation.'}`, 6000);
      if (state.vue === 'dev' && !document.activeElement?.matches('input,select,textarea')) vueDev(); else renderNav();
    })
    .subscribe(st => { setConn(st === 'SUBSCRIBED', st === 'SUBSCRIBED' ? 'En direct' : st === 'CHANNEL_ERROR' ? 'Reconnexion…' : 'Connexion…'); });
  // Nouveaux membres : rafraîchir la liste (pas de temps réel sur la table, on recharge à la demande)
  c.from('kp_members').select('*').order('created_at').then(r => { if (r.data) state.membres = r.data; });
}

async function demarrerSession(session) {
  state.session = session;
  try {
    await chargerTout();
  } catch (e) {
    console.error(e);
    if (String(e.message).includes('PROFIL_ABSENT')) { msgLogin('err', 'Votre compte existe mais n’est pas (ou plus) membre de cet espace. Contactez Paul.'); await state.client.auth.signOut(); return; }
    msgLogin('err', 'Chargement impossible : ' + esc(e.message)); return;
  }
  $('#login').hidden = true; $('#app').hidden = false;
  if (state.moi.is_admin) await chargerDev();
  go(vuesVisibles().find(v => v[0] === state.vue) ? state.vue : 'discussions');
  brancherTempsReel();
  if (state.vue === 'discussions' && window.matchMedia('(max-width:820px)').matches && totalNonLus() === 0 && state.canal) { /* on reste sur la liste des canaux */ }
}
(function boot() {
  state.client = supabase.createClient(SUPA.url, SUPA.key, { auth: { flowType: 'implicit', persistSession: true, detectSessionInUrl: true }, realtime: { params: { eventsPerSecond: 10 } } });
  initLogin();
  let demarre = false;
  state.client.auth.onAuthStateChange((evt, session) => {
    if (session && !demarre) { demarre = true; demarrerSession(session); }
    if (evt === 'SIGNED_OUT') { demarre = false; $('#app').hidden = true; $('#login').hidden = false; }
  });
  state.client.auth.getSession().then(({ data }) => { if (data.session && !demarre) { demarre = true; demarrerSession(data.session); } else if (!data.session) { $('#l-email').focus(); } });
  if (location.hash.includes('error=')) { const p = new URLSearchParams(location.hash.slice(1)); msgLogin('err', 'Lien invalide ou expiré : ' + esc(p.get('error_description') || p.get('error'))); history.replaceState(null, '', location.pathname); }
  window.addEventListener('offline', () => setConn(false, 'Hors ligne'));
  window.addEventListener('online', () => setConn(true, 'En direct'));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && state.vue === 'discussions' && state.canal && state.moi) { renderFil(true); marquerLu(state.canal); } });
})();

</script>
