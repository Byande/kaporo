<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0C1C35">
<meta name="description" content="Kaporo — espace de travail sécurisé des programmes Kaporo 1 et Kaporo 2 (Conakry) : discussions, documents, décisions, suivi, rédaction collaborative, budget.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kaporo">
<title>Kaporo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230C1C35'/%3E%3Cpath d='M16 48V16h8v14l14-14h10L32 32l17 16H38L24 34v14z' fill='%23C8992A'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230C1C35'/%3E%3Cpath d='M16 48V16h8v14l14-14h10L32 32l17 16H38L24 34v14z' fill='%23C8992A'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --encre:#0C1C35; --marine:#1E3A5F; --or:#C8992A; --or-fond:#FBF4E3; --laterite:#B4532A;
  --ivoire:#F4EFE4; --papier:#FFFFFF; --pierre:#6B6B6B; --trait:#DCD4C4; --grille:#ECE6DA; --texte:#0C1C35;
  --vert:#2E7D32; --vert-fond:#E6F2E7; --ambre:#C77700; --ambre-fond:#FFF1DC; --rouge:#B3261E; --rouge-fond:#FBE7E5; --bleu:#2F5A9E; --bleu-fond:#E4ECF7;
  --bulle-moi:#E3EFDC; --bulle-autre:#FFFFFF; --fond-chat:#EFE9DC;
  --serif:Georgia,"Times New Roman",serif; --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:.6em; --nav-w:15em; --top-h:3.4em; --tab-h:3.6em;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ivoire);color:var(--texte);font-family:var(--sans);font-size:clamp(14px,.95vw,16px);line-height:1.4;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%;display:block}
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;line-height:1.15}
a{color:var(--marine)}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--pierre)}
.sm{font-size:.86em}

/* ---- Connexion ---- */
#login{min-height:100%;display:grid;place-items:center;padding:1.5em;background:linear-gradient(160deg,var(--encre) 0%,var(--marine) 60%,#2b4f7e 100%)}
#login .boite{background:var(--papier);border-radius:1em;padding:1.8em 1.6em;width:min(26em,100%);box-shadow:0 20px 60px rgba(0,0,0,.35)}
#login .logo{width:3.2em;height:3.2em;border-radius:.7em;background:var(--encre);display:grid;place-items:center;margin-bottom:1em}
#login h1{font-size:1.9em;margin-bottom:.1em}
#login .sous{color:var(--pierre);margin-bottom:1.4em}
.champ{display:block;margin-bottom:.9em}
.champ span{display:block;font-size:.82em;font-weight:600;color:var(--pierre);margin-bottom:.3em}
.champ input,.champ select,.champ textarea{width:100%;border:1px solid var(--trait);border-radius:.5em;padding:.65em .8em;background:#fff}
.champ input:focus,.champ select:focus,.champ textarea:focus{outline:2px solid var(--or);border-color:var(--or)}
.msg{padding:.7em .9em;border-radius:.5em;font-size:.92em;margin:.8em 0}
.msg.ok{background:var(--vert-fond);color:var(--vert)}.msg.err{background:var(--rouge-fond);color:var(--rouge)}.msg.info{background:var(--bleu-fond);color:var(--bleu)}
.lien{background:none;border:0;color:var(--marine);text-decoration:underline;font-size:.9em;padding:.4em 0}

/* ---- Coquille ---- */
.app{display:grid;grid-template-columns:var(--nav-w) 1fr;grid-template-rows:auto 1fr;height:100dvh;overflow:hidden}
header.top{grid-column:1/-1;background:var(--encre);color:#fff;display:flex;align-items:center;gap:.8em;padding:.5em .9em;padding-top:calc(.5em + var(--sat));z-index:20}
.brand{display:flex;align-items:center;gap:.6em;min-width:0}
.brand .logo{width:2.2em;height:2.2em;border-radius:.5em;background:var(--or);color:var(--encre);font-family:var(--serif);font-weight:700;display:grid;place-items:center;font-size:1.05em;flex:none}
.brand b{font-family:var(--serif);font-weight:400;font-size:1.2em;display:block;line-height:1.1}
.brand small{opacity:.72;font-size:.78em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:.4em;padding:.2em .65em;border-radius:1em;font-size:.78em;font-weight:600;background:rgba(255,255,255,.12);white-space:nowrap}
.pill i{width:.55em;height:.55em;border-radius:50%;background:var(--pierre);display:inline-block}
.pill.on i{background:#5BD08A;box-shadow:0 0 0 3px rgba(91,208,138,.25)}
.pill.off i{background:var(--or)}
.avatar{width:2.1em;height:2.1em;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.85em;flex:none;letter-spacing:.02em}
nav.side{background:var(--papier);border-right:1px solid var(--trait);padding:.8em .6em;display:flex;flex-direction:column;gap:.15em;overflow:auto}
nav.side .grp{font-size:.72em;text-transform:uppercase;letter-spacing:.08em;color:var(--pierre);padding:.9em .7em .3em}
nav.side button{display:flex;align-items:center;gap:.6em;width:100%;text-align:left;background:none;border:0;padding:.6em .7em;border-radius:.45em;color:var(--texte)}
nav.side button:hover{background:var(--ivoire)}
nav.side button.on{background:var(--encre);color:#fff}
nav.side button .ic{width:1.3em;text-align:center;font-size:1.05em}
.bd{margin-left:auto;background:var(--rouge);color:#fff;font-size:.72em;border-radius:1em;padding:.1em .5em;font-weight:700;min-width:1.6em;text-align:center}
nav.side button.on .bd{background:var(--or);color:var(--encre)}
nav.tabs{display:none}
main{min-width:0;min-height:0;overflow:auto;padding:1.1em 1.3em 3em}
main.chat{padding:0;overflow:hidden}
.vue>h1{font-size:1.7em;margin-bottom:.15em}
.vue>.sous{color:var(--pierre);margin-bottom:1em;max-width:70ch}

/* ---- Composants ---- */
.g{display:grid;gap:1em}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.carte{background:var(--papier);border:1px solid var(--trait);border-radius:var(--r);padding:1em 1.1em;min-width:0}
.carte>h3{font-size:1.15em;margin-bottom:.6em;display:flex;justify-content:space-between;align-items:baseline;gap:.8em;flex-wrap:wrap}
.carte>h3 small{font-family:var(--sans);font-size:.72em;color:var(--pierre)}
.carte.accent{border-color:var(--or);background:var(--or-fond)}
.etat{font-size:.76em;font-weight:700;padding:.14em .6em;border-radius:1em;background:var(--vert-fond);color:var(--vert);white-space:nowrap}
.etat.ambre{background:var(--ambre-fond);color:var(--ambre)}.etat.rouge{background:var(--rouge-fond);color:var(--rouge)}.etat.bleu{background:var(--bleu-fond);color:var(--bleu)}.etat.gris{background:var(--grille);color:var(--pierre)}
.btn{border:1px solid var(--trait);background:var(--papier);padding:.55em 1em;border-radius:.45em;font-weight:600;display:inline-flex;align-items:center;gap:.45em;line-height:1.2}
.btn:hover{border-color:var(--marine)}
.btn.prim{background:var(--encre);color:#fff;border-color:var(--encre)}
.btn.or{background:var(--or);color:var(--encre);border-color:var(--or)}
.btn.rouge{background:var(--rouge);color:#fff;border-color:var(--rouge)}
.btn.sm{padding:.3em .7em;font-size:.86em}
.btn.bloc{width:100%;justify-content:center;padding:.75em}
.btn:disabled{opacity:.45;cursor:default}
.actions{display:flex;gap:.6em;flex-wrap:wrap;align-items:center}
.ligne{display:flex;justify-content:space-between;gap:1em;padding:.55em 0;border-top:1px solid var(--grille);font-size:.94em;align-items:center}
.ligne:first-child{border-top:0}
.ligne small{color:var(--pierre);display:block;font-size:.88em}
.filtres{display:flex;gap:.5em;flex-wrap:wrap;margin-bottom:1em}
.filtres button{border:1px solid var(--trait);background:var(--papier);border-radius:1em;padding:.3em .85em;font-size:.86em;font-weight:600}
.filtres button.on{background:var(--encre);color:#fff;border-color:var(--encre)}
.vide{color:var(--pierre);padding:1.5em;text-align:center;font-style:italic}
select.inline{border:1px solid var(--trait);border-radius:.4em;padding:.25em .4em;background:#fff;font-size:.86em}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + var(--sab) + 1em);transform:translateX(-50%);background:var(--encre);color:#fff;padding:.7em 1.1em;border-radius:.6em;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:50;font-size:.92em;max-width:90vw;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(12,28,53,.55);display:grid;place-items:end center;z-index:40;padding:0}
.modal .boite{background:var(--papier);border-radius:1em 1em 0 0;padding:1.2em 1.2em calc(1.2em + var(--sab));width:min(34em,100%);max-height:92dvh;overflow:auto}
.modal h3{font-size:1.25em;margin-bottom:.8em}
.phase{display:grid;grid-template-columns:2.2em 1fr auto;gap:.7em;padding:.7em 0;border-top:1px solid var(--grille);align-items:start}
.phase:first-child{border-top:0}
.phase .n{width:2em;height:2em;border-radius:50%;background:var(--grille);display:grid;place-items:center;font-weight:700;font-size:.85em;color:var(--pierre)}
.phase.encours .n{background:var(--or);color:var(--encre)}.phase.fait .n{background:var(--vert);color:#fff}
.phase b{display:block}
.phase small{color:var(--pierre);display:block;font-size:.86em}
.doc{display:grid;grid-template-columns:2.6em 1fr auto;gap:.7em;align-items:center;padding:.6em 0;border-top:1px solid var(--grille)}
.doc:first-child{border-top:0}
.doc .ic{width:2.6em;height:2.6em;border-radius:.5em;background:var(--bleu-fond);color:var(--bleu);display:grid;place-items:center;font-size:.8em;font-weight:700}
.doc b{display:block;overflow:hidden;text-overflow:ellipsis}
.doc small{color:var(--pierre);display:block;font-size:.85em}
.tache{display:grid;grid-template-columns:auto 1fr auto;gap:.7em;align-items:center;padding:.55em 0;border-top:1px solid var(--grille)}
.tache:first-child{border-top:0}
.tache input[type=checkbox]{width:1.3em;height:1.3em;accent-color:var(--vert)}
.tache.fait b{text-decoration:line-through;color:var(--pierre);font-weight:400}
.tache small{color:var(--pierre);display:block;font-size:.85em}
.tache.retard small{color:var(--rouge);font-weight:600}

/* ---- Discussions ---- */
.chat-wrap{display:grid;grid-template-columns:17em 1fr;height:100%;min-height:0}
.canaux{border-right:1px solid var(--trait);background:var(--papier);overflow:auto}
.canaux h2{font-size:1.1em;padding:1em 1em .5em}
.canal{display:flex;align-items:center;gap:.7em;width:100%;text-align:left;background:none;border:0;padding:.75em 1em;border-top:1px solid var(--grille)}
.canal:hover{background:var(--ivoire)}
.canal.on{background:var(--or-fond)}
.canal .ic{width:2.4em;height:2.4em;border-radius:50%;background:var(--encre);color:var(--or);display:grid;place-items:center;font-family:var(--serif);font-weight:700;flex:none}
.canal.gen .ic{background:var(--or);color:var(--encre)}
.canal b{display:block;font-weight:600}
.canal small{display:block;color:var(--pierre);font-size:.84em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:11em}
.canal .meta{margin-left:auto;text-align:right;font-size:.75em;color:var(--pierre);display:flex;flex-direction:column;align-items:flex-end;gap:.25em}
.canal .bd{margin:0}
.canal .bd.at{background:var(--or);color:var(--encre)}
.canaux .grp{font-size:.72em;text-transform:uppercase;letter-spacing:.08em;color:var(--pierre);padding:1em 1em .4em;display:flex;align-items:center;justify-content:space-between;gap:.5em}
.canaux .grp .btn{text-transform:none;letter-spacing:0;font-size:1.05em;padding:.25em .7em;white-space:nowrap;flex:none}
.canaux .vide-sm{padding:.3em 1em 1em;color:var(--pierre);font-size:.84em;line-height:1.4}
.choix{display:flex;align-items:center;gap:.7em;padding:.55em 0;border-top:1px solid var(--grille);cursor:pointer}
.choix:first-child{border-top:0}
.choix input{width:1.25em;height:1.25em;accent-color:var(--or);flex:none}
.choix b{display:block}.choix small{color:var(--pierre);font-size:.86em}
.mention{background:var(--or-fond);color:var(--marine);font-weight:700;border-radius:.3em;padding:0 .2em}
.mention.moi{background:var(--or);color:var(--encre)}
.bulle.mention-moi{box-shadow:0 0 0 2px var(--or),0 1px 1px rgba(0,0,0,.08)}
.composer{position:relative}
.mention-pop{position:absolute;bottom:calc(100% - .3em);left:.6em;width:min(22em,calc(100% - 1.2em));background:var(--papier);border:1px solid var(--trait);border-radius:.7em;box-shadow:0 10px 28px rgba(12,28,53,.2);max-height:14em;overflow:auto;z-index:6}
.mention-pop button{display:flex;align-items:center;gap:.6em;width:100%;text-align:left;background:none;border:0;padding:.5em .7em;border-top:1px solid var(--grille)}
.mention-pop button:first-child{border-top:0}
.mention-pop button.on,.mention-pop button:hover{background:var(--or-fond)}
.mention-pop b{display:block;font-size:.95em}.mention-pop small{color:var(--pierre);display:block;font-size:.82em}
.salon{display:flex;flex-direction:column;min-height:0;height:100%;background:var(--fond-chat)}
.salon .tete{display:flex;align-items:center;gap:.7em;padding:.6em .9em;background:var(--papier);border-bottom:1px solid var(--trait)}
.salon .tete .retour{display:none;background:none;border:0;font-size:1.3em;padding:.1em .3em}
.salon .tete b{display:block}
.salon .tete small{color:var(--pierre);font-size:.84em}
.fil{flex:1;overflow:auto;padding:.8em .9em;display:flex;flex-direction:column;gap:.25em;-webkit-overflow-scrolling:touch}
.jour{align-self:center;background:rgba(12,28,53,.08);color:var(--marine);font-size:.74em;font-weight:600;padding:.25em .8em;border-radius:1em;margin:.6em 0 .4em}
.bulle{max-width:min(78%,36em);background:var(--bulle-autre);border-radius:.8em;padding:.45em .7em .35em;box-shadow:0 1px 1px rgba(0,0,0,.08);position:relative;align-self:flex-start;word-wrap:break-word;overflow-wrap:anywhere}
.bulle.moi{align-self:flex-end;background:var(--bulle-moi);border-bottom-right-radius:.2em}
.bulle:not(.moi){border-bottom-left-radius:.2em}
.bulle .qui{font-size:.78em;font-weight:700;margin-bottom:.1em}
.bulle .txt{white-space:pre-wrap}
.bulle .txt a{word-break:break-all}
.bulle .quand{font-size:.68em;color:var(--pierre);text-align:right;margin-top:.15em;display:flex;gap:.4em;justify-content:flex-end;align-items:center}
.bulle .rep{border-left:3px solid var(--or);background:rgba(12,28,53,.05);padding:.3em .5em;border-radius:.3em;font-size:.82em;margin-bottom:.3em;color:var(--pierre);max-height:4em;overflow:hidden}
.bulle .rep b{display:block;color:var(--marine);font-size:.95em}
.bulle img.pj{border-radius:.5em;max-height:18em;object-fit:cover;margin:.2em 0;cursor:pointer;background:var(--grille);min-width:8em;min-height:3em}
.bulle .fichier{display:flex;align-items:center;gap:.6em;background:rgba(12,28,53,.06);border-radius:.5em;padding:.5em .6em;margin:.2em 0;text-decoration:none;color:var(--texte)}
.bulle .fichier .ic{width:2.2em;height:2.2em;border-radius:.4em;background:var(--encre);color:var(--or);display:grid;place-items:center;font-size:.7em;font-weight:700;flex:none}
.bulle .fichier b{display:block;font-size:.9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:14em}
.bulle .fichier small{color:var(--pierre);font-size:.78em}
.bulle.supprime .txt{font-style:italic;color:var(--pierre)}
.bulle.sel{outline:2px solid var(--or)}
.bulle-actions{align-self:center;display:flex;gap:.4em;margin:.2em 0 .4em;flex-wrap:wrap;justify-content:center}
.bulle-actions button{border:1px solid var(--trait);background:var(--papier);border-radius:1em;padding:.3em .8em;font-size:.82em;font-weight:600}
.systeme{align-self:center;font-size:.8em;color:var(--pierre);font-style:italic;margin:.3em 0}
.composer{background:var(--papier);border-top:1px solid var(--trait);padding:.5em .6em calc(.5em + var(--sab))}
.composer .repondre{display:flex;align-items:center;gap:.6em;border-left:3px solid var(--or);background:var(--or-fond);padding:.35em .6em;border-radius:.3em;font-size:.84em;margin-bottom:.4em}
.composer .repondre b{display:block;color:var(--marine)}
.composer .repondre span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--pierre)}
.composer .repondre button{background:none;border:0;font-size:1.1em;color:var(--pierre)}
.composer .pj-apercu{display:flex;align-items:center;gap:.6em;background:var(--bleu-fond);padding:.4em .6em;border-radius:.4em;font-size:.86em;margin-bottom:.4em}
.composer .pj-apercu img{width:3em;height:3em;object-fit:cover;border-radius:.3em}
.composer .pj-apercu span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.composer .pj-apercu button{background:none;border:0;font-size:1.1em}
.composer .barre{display:flex;align-items:flex-end;gap:.4em}
.composer textarea{flex:1;border:1px solid var(--trait);border-radius:1.2em;padding:.6em .9em;resize:none;max-height:9em;min-height:2.6em;line-height:1.35;background:#fff}
.composer textarea:focus{outline:2px solid var(--or);border-color:var(--or)}
.composer .rond{width:2.7em;height:2.7em;border-radius:50%;border:0;display:grid;place-items:center;font-size:1.1em;flex:none}
.composer .rond.pj{background:var(--grille);color:var(--marine)}
.composer .rond.env{background:var(--encre);color:var(--or)}
.composer .rond:disabled{opacity:.4}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:grid;place-items:center;z-index:60;padding:1em}
.lightbox img{max-width:100%;max-height:92dvh;object-fit:contain;border-radius:.3em}
.lightbox button{position:absolute;top:calc(.6em + var(--sat));right:.8em;background:rgba(255,255,255,.15);color:#fff;border:0;width:2.6em;height:2.6em;border-radius:50%;font-size:1.2em}

/* ---- Suivi ---- */
.suivi-tete{display:flex;justify-content:space-between;gap:1em;align-items:flex-start;flex-wrap:wrap}
.suivi-tete .sous{margin-bottom:.4em}
.onglets{display:flex;gap:.2em;border-bottom:2px solid var(--trait);margin:.4em 0 .8em;overflow-x:auto;scrollbar-width:none}
.onglets button{background:none;border:0;padding:.6em .9em;font-weight:600;color:var(--pierre);border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;display:inline-flex;gap:.35em;align-items:center}
.onglets button.on{color:var(--encre);border-bottom-color:var(--or)}
.barre-filtres{display:flex;gap:.5em;flex-wrap:wrap;align-items:center;margin-bottom:1em}
.barre-filtres .filtres{margin:0}
.barre-filtres input[type=search],.barre-filtres select{border:1px solid var(--trait);border-radius:1em;padding:.35em .8em;background:#fff;font-size:.86em;font-weight:600}
.barre-filtres input[type=search]{min-width:11em}
.coche{display:inline-flex;gap:.35em;align-items:center;font-size:.86em;font-weight:600;color:var(--pierre)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:.8em;margin-bottom:1em}
.kpi{background:var(--papier);border:1px solid var(--trait);border-radius:var(--r);padding:.8em 1em}
.kpi b{font-size:1.9em;font-family:var(--serif);display:block;line-height:1;margin-bottom:.25em}
.kpi small{color:var(--pierre);font-size:.74em;font-weight:600;text-transform:uppercase;letter-spacing:.04em}

const pad = n => String(n).padStart(2, '0');

const MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
function dateFr(x, opts = {}) {
  if (!x) return '—';
  const d = x instanceof Date ? x : new Date(x.length === 10 ? x + 'T12:00:00' : x);
  if (isNaN(d)) return '—';
  const s = d.getDate() + ' ' + MOIS[d.getMonth()] + (opts.annee === false ? '' : ' ' + d.getFullYear());
  return opts.jour ? JOURS[d.getDay()] + ' ' + s : s;
}
function jourRelatif(d) {
  const a = new Date(); a.setHours(0, 0, 0, 0);
  const b = new Date(d); b.setHours(0, 0, 0, 0);
  const diff = Math.round((a - b) / 86400000);
  if (diff === 0) return 'Aujourd’hui';
  if (diff === 1) return 'Hier';
  if (diff < 7) return JOURS[b.getDay()].replace(/^./, c => c.toUpperCase());
  return dateFr(b, { jour: true });
}
const octets = n => !n ? '' : n < 1024 ? n + ' o' : n < 1048576 ? (n / 1024).toFixed(0) + ' Ko' : (n / 1048576).toFixed(1) + ' Mo';

/* Fichiers du coffre : URLs signées (1 h), mises en cache */
async function urlFichier(path) {
  const c = state.urls[path];
  if (c && c.exp > Date.now()) return c.url;
  const { data, error } = await state.client.storage.from(SUPA.bucket).createSignedUrl(path, 3600);
  if (error) throw error;
  state.urls[path] = { url: data.signedUrl, exp: Date.now() + 3300000 };
  return data.signedUrl;
}
async function televerser(file, dossier) {
  const nom = file.name.replace(/[^\w.\-]+/g, '_').slice(-80);
  const path = `${dossier}/${Date.now()}_${nom}`;
  const { error } = await state.client.storage.from(SUPA.bucket).upload(path, file, { contentType: file.type || 'application/octet-stream', upsert: false });
  if (error) throw error;
  return { path, name: file.name, mime: file.type, size: file.size };
}

function expliquerErreur(e) {

/* Mentions : @Prénom, @Prénom Nom ou @tous. Les noms mentionnés sont surlignés dans la bulle. */
const MOTS_TOUS = ['tous', 'toutes', 'équipe', 'equipe', 'all'];
function nomsMention(u) { return [u.name, prenom(u.name)].filter(Boolean); }
function regexMentions(membres, flags) {
  const noms = [...MOTS_TOUS];
  for (const u of membres) noms.push(...nomsMention(u));
  const alt = [...new Set(noms)].sort((a, b) => b.length - a.length).map(echapRegex).join('|');
  return new RegExp('(^|[^\\p{L}\\p{N}_@])@(' + alt + ')(?![\\p{L}\\p{N}_])', flags);
}
function formaterCorps(m) {
  const html = linkify(m.body);
  const ids = m.mentions || []; if (!ids.length) return html;
  const membres = ids.map(membre);
  return html.replace(regexMentions(membres, 'giu'), (tout, avant, nom) => {
    const bas = nom.toLowerCase();
    const u = MOTS_TOUS.includes(bas) ? null : membres.find(x => nomsMention(x).some(n => n.toLowerCase() === bas));
    const moi = (u && u.user_id === state.moi.user_id) || (!u && ids.includes(state.moi.user_id));
    return `${avant}<span class="mention ${moi ? 'moi' : ''}">@${nom}</span>`;
  });
}
function extraireMentions(body) {
  if (!body || !body.includes('@')) return [];
  const autres = state.membres.filter(u => u.user_id !== state.moi.user_id);
  const ids = new Set();
  const re = regexMentions(autres, 'giu'); let r;
  while ((r = re.exec(body))) {
    const bas = r[2].toLowerCase();
    if (MOTS_TOUS.includes(bas)) autres.forEach(u => ids.add(u.user_id));
    else { const u = autres.find(x => nomsMention(x).some(n => n.toLowerCase() === bas)); if (u) ids.add(u.user_id); }
  }
  return [...ids];
}

/* Popup « @ » : propose les membres (ou les participants d'une conversation privée) pendant la saisie */
const sansAccents = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
function requeteMention(txt) {
  const avant = txt.value.slice(0, txt.selectionStart);
  const r = avant.match(/(^|\s)@([\p{L}\p{N}_'’-]*)$/u);
  return r ? { debut: avant.length - r[2].length - 1, q: r[2] } : null;
}
function majPopupMentions(txt) {
  const pop = $('#mention-pop'); if (!pop) return;
  const rq = requeteMention(txt);
  if (!rq) { pop.hidden = true; return; }
  const c = state.canaux.find(x => x.id === state.canal);
  let base = state.membres.filter(m => m.user_id !== state.moi.user_id);
  if (estPrive(c)) base = base.filter(m => participants(c.id).includes(m.user_id));
  const q = sansAccents(rq.q);
  const choix = base.filter(m => !q || sansAccents(m.name).split(/\s+/).some(w => w.startsWith(q)) || sansAccents(m.name).startsWith(q));
  const tous = !q || 'tous'.startsWith(q) || 'equipe'.startsWith(q);
  if (!choix.length && !tous) { pop.hidden = true; return; }
  pop.innerHTML = choix.map((m, i) => `<button type="button" class="${i === 0 ? 'on' : ''}" data-nom="${esc(libelleMention(m))}"><span class="avatar" style="background:${m.color}">${initiales(m.name)}</span><span><b>${esc(m.name)}</b><small>${esc(m.role)}</small></span></button>`).join('')
    + (tous && !estPrive(c) ? `<button type="button" class="${choix.length ? '' : 'on'}" data-nom="tous"><span class="avatar" style="background:var(--or);color:var(--encre)">@</span><span><b>@tous</b><small>Prévenir toute l’équipe</small></span></button>` : '');
  pop.hidden = false;
  $$('button', pop).forEach(b => b.addEventListener('mousedown', e => e.preventDefault()));
  $$('button', pop).forEach(b => b.addEventListener('click', () => insererMention(txt, rq, b.dataset.nom)));
}
/* Prénom seul si unique dans l'équipe, sinon prénom + nom */
function libelleMention(m) {
  const p = prenom(m.name);
  return state.membres.filter(x => prenom(x.name).toLowerCase() === p.toLowerCase()).length > 1 ? m.name : p;
}
function insererMention(txt, rq, nom) {
  const fin = txt.selectionStart;
  txt.value = txt.value.slice(0, rq.debut) + '@' + nom + ' ' + txt.value.slice(fin);
  const pos = rq.debut + nom.length + 2; txt.setSelectionRange(pos, pos); txt.focus();
  $('#mention-pop').hidden = true;
}
let envoiEnCours = false;
async function envoyer() {
  if (envoiEnCours) return;
  const txt = $('#txt'); const body = txt.value.trim();
  if (!body && !state.pj) return;
  envoiEnCours = true; $('#env').disabled = true;
  try {
    let attachment = null;
    if (state.pj) { toast('Envoi du fichier…', 8000); attachment = await televerser(state.pj.file, 'chat/' + state.canal); }
    const row = { channel_id: state.canal, author: state.moi.user_id, body, attachment, reply_to: state.reponseA?.id || null, mentions: extraireMentions(body) };
    const { data, error } = await state.client.from('kp_messages').insert(row).select().single();
    if (error) throw error;
    if (!state.messages.find(m => m.id === data.id)) state.messages.push(data);
    state.reponseA = null; state.pj = null; txt.value = ''; txt.style.height = 'auto';
    renderComposer(); renderFil(); renderCanaux(); marquerLu(state.canal); $('#txt').focus();
    $('#toast').classList.remove('on');
  } catch (e) { console.error(e); toast('<b>Envoi impossible.</b> Vérifiez la connexion.'); }
  envoiEnCours = false; const b = $('#env'); if (b) b.disabled = false;
}
async function marquerLu(id) {
  const now = new Date().toISOString(); state.lectures[id] = now; renderNav();
  await state.client.from('kp_reads').upsert({ user_id: state.moi.user_id, channel_id: id, last_read: now });
}
function messageRecu(m) {
  if (!state.canaux.find(c => c.id === m.channel_id)) { rechargerCanaux(); return; }
  const i = state.messages.findIndex(x => x.id === m.id);
  if (i >= 0) state.messages[i] = m; else state.messages.push(m);
  state.messages.sort((a, b) => a.created_at < b.created_at ? -1 : 1);
  const visible = state.vue === 'discussions' && state.canal === m.channel_id && (state.salonOuvert || window.matchMedia('(min-width:821px)').matches) && document.visibilityState === 'visible';
  if (visible) { renderFil(true); marquerLu(m.channel_id); }
  if (state.vue === 'discussions') renderCanaux();
  renderNav();
  if (i < 0 && m.author !== state.moi.user_id) {
    const a = membre(m.author); const c = state.canaux.find(x => x.id === m.channel_id); const nc = nomCanal(c) || 'Kaporo';
    const mention = meMentionne(m);
    if (!visible) toast(`<b>${esc(a.name)}</b> · ${esc(nc)}${mention ? ' · <b>vous mentionne</b>' : ''}<br>${esc(resumeMessage(m))}`, mention ? 5000 : 2600);
    if ((document.visibilityState !== 'visible' || mention && !visible) && 'Notification' in window && Notification.permission === 'granted') {
      try { new Notification(a.name + ' · ' + nc + (mention ? ' · vous mentionne' : ''), { body: resumeMessage(m), tag: m.id }); } catch (e) { }
    }
  }
}

/* ---- Développement (administrateur) : demandes transmises à l'agent de développement ---- */
const STATUTS_DEV = { 'envoyée': ['bleu', 'Transmise'], 'en cours': ['ambre', 'En cours'], 'question': ['ambre', 'Question'], 'livrée': ['', 'Livrée'], 'abandonnée': ['gris', 'Abandonnée'], 'erreur': ['rouge', 'Erreur'] };
async function chargerDev() {

}

function carteDev(d) {
  const [cls, lib] = STATUTS_DEV[d.status] || ['gris', d.status];

async function envoyerDev() {

/* ============================================================
   Suivi : tableau de bord, liste, kanban, Gantt, calendrier, fiche tâche, phases
   ============================================================ */
const STATUTS_T = [['à faire', 'À faire', 'gris'], ['en cours', 'En cours', 'ambre'], ['en attente', 'En attente', 'bleu'], ['fait', 'Fait', '']];
const PRIOS = [['urgente', 'Urgente', 'rouge'], ['haute', 'Haute', 'ambre'], ['normale', 'Normale', ''], ['basse', 'Basse', 'gris']];
const MOIS_LONG = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const infoStatut = s => STATUTS_T.find(x => x[0] === s) || [s, s, 'gris'];
const infoPrio = p => PRIOS.find(x => x[0] === p) || PRIOS[2];
const rangPrio = p => { const i = PRIOS.findIndex(x => x[0] === p); return i < 0 ? 2 : i; };
const ISO = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const dateDe = iso => new Date(iso + 'T12:00:00');
const auj = () => ISO(new Date());
const plusJours = (iso, n) => { const d = dateDe(iso); d.setDate(d.getDate() + n); return ISO(d); };
const diffJours = (a, b) => Math.round((dateDe(b) - dateDe(a)) / 86400000);
const enRetard = t => t.status !== 'fait' && !!t.due_on && t.due_on < auj();
const phaseDe = id => state.phases.find(p => p.id === id);
const tachesDePhase = id => state.taches.filter(t => t.phase_id === id);
const peutSupprimer = t => t.created_by === state.moi.user_id || state.moi.is_admin || !t.created_by;
function progPhase(ph) {
  if (ph.status === 'terminée') return 100;
  const ts = tachesDePhase(ph.id);
  if (ts.length) return Math.round(ts.reduce((s, t) => s + (t.status === 'fait' ? 100 : t.progress || 0), 0) / ts.length);
  return ph.progress || 0;
}

/* Persistance */
async function sauverTache(id, patch, { silencieux } = {}) {
  const t = state.taches.find(x => x.id === id); if (!t) return false;
  const avant = { ...t };
  if (patch.status === 'fait') { patch.done_at = patch.done_at || new Date().toISOString(); patch.progress = 100; }
  else if (patch.status && avant.status === 'fait') { patch.done_at = null; if (patch.progress === undefined && avant.progress === 100) patch.progress = 0; }
  Object.assign(t, patch);
  const { error } = await state.client.from('kp_tasks').update(patch).eq('id', id);
  if (error) { Object.assign(t, avant); toast('Modification impossible : ' + esc(error.message)); return false; }
  if (!silencieux) toast('Enregistré', 1200);
  renderNav();
  return true;
}
async function creerTache(c) {
  const row = { title: c.title, description: c.description || null, project_id: c.project_id || null, phase_id: c.phase_id || null, assignee: c.assignee || null, priority: c.priority || 'normale', status: c.status || 'à faire', start_on: c.start_on || null, due_on: c.due_on || null, created_by: state.moi.user_id, sort: Date.now() / 1000 };
  if (row.status === 'fait') { row.progress = 100; row.done_at = new Date().toISOString(); }
  const { data, error } = await state.client.from('kp_tasks').insert(row).select().single();
  if (error) { toast('Création impossible : ' + esc(error.message)); return null; }
  if (!state.taches.find(t => t.id === data.id)) state.taches.push(data);
  return data;
}
async function supprimerTache(id) {
  if (!confirm('Supprimer cette tâche ?')) return false;
  const { error } = await state.client.from('kp_tasks').delete().eq('id', id);
  if (error) { toast('Suppression impossible'); return false; }
  state.taches = state.taches.filter(t => t.id !== id); return true;
}
async function sauverPhase(id, patch) {
  const ph = phaseDe(id); if (!ph) return false;
  const avant = { ...ph }; Object.assign(ph, patch);
  const { error } = await state.client.from('kp_phases').update(patch).eq('id', id);
  if (error) { Object.assign(ph, avant); toast('Modification impossible : ' + esc(error.message)); return false; }
  toast('Phase enregistrée', 1200); return true;
}

const jauge = (p, cls = '') => `<span class="jauge ${cls}"><i style="width:${Math.max(0, Math.min(100, p || 0))}%"></i></span>`;
const dateCourte = iso => dateFr(iso, { annee: dateDe(iso).getFullYear() !== new Date().getFullYear() });
function echeanceLib(t) {
  if (!t.due_on) return '';
  if (t.status === 'fait') return dateCourte(t.due_on);
  const d = diffJours(auj(), t.due_on);
  if (d < 0) return `Retard de ${-d} j`; if (d === 0) return 'Aujourd’hui'; if (d === 1) return 'Demain'; if (d < 7) return `Dans ${d} j`;

/* ---- Gantt ---- */
function rendreGantt(corps) {
  const s = state.suivi; const a = auj();
  const PX = { semaine: 14, mois: 6, trimestre: 1.8 }[s.echelle] || 6;
  const projets = state.projets.filter(p => state.filtreProjet === 'tous' || state.filtreProjet === p.id);
  const ts = tachesVisibles(true);
  const lignes = [];
  projets.forEach(p => {
    lignes.push({ type: 'projet', l: p.name });
    state.phases.filter(x => x.project_id === p.id).sort((x, y) => x.num - y.num).forEach(ph => {
      const tp = ts.filter(t => t.phase_id === ph.id).sort(triTaches);
      lignes.push({ type: 'phase', ph, n: tp.length });
      if (!s.plies[ph.id]) tp.forEach(t => lignes.push({ type: 'tache', t }));
    });
    const sans = ts.filter(t => t.project_id === p.id && (!t.phase_id || !phaseDe(t.phase_id))).sort(triTaches);
    if (sans.length) { const id = 'sans-' + p.id; lignes.push({ type: 'groupe', l: 'Sans phase', id, n: sans.length }); if (!s.plies[id]) sans.forEach(t => lignes.push({ type: 'tache', t })); }
  });
  if (state.filtreProjet === 'tous' || state.filtreProjet === '') { const gen = ts.filter(t => !t.project_id).sort(triTaches); if (gen.length) { lignes.push({ type: 'groupe', l: 'Général', id: 'gen', n: gen.length }); if (!s.plies.gen) gen.forEach(t => lignes.push({ type: 'tache', t })); } }
  const dates = [a];
  state.phases.forEach(ph => { if (projets.find(p => p.id === ph.project_id)) { if (ph.start_on) dates.push(ph.start_on); if (ph.end_on) dates.push(ph.end_on); } });
  ts.forEach(t => { if (t.start_on) dates.push(t.start_on); if (t.due_on) dates.push(t.due_on); });
  dates.sort();
  const debut = plusJours(dates[0], -7).slice(0, 8) + '01';
  const finD = dateDe(plusJours(dates[dates.length - 1], 45)); const fin = ISO(new Date(finD.getFullYear(), finD.getMonth() + 1, 1));
  const X = iso => diffJours(debut, iso) * PX; const W = X(fin);
  let mois = '', axes = '', d = debut;
  while (d < fin) {
    const dm = dateDe(d); const suivant = ISO(new Date(dm.getFullYear(), dm.getMonth() + 1, 1)); const w = diffJours(d, suivant) * PX;
    mois += `<div class="gmois" style="left:${X(d)}px;width:${w}px">${w > 34 ? MOIS[dm.getMonth()] + (w > 64 ? ' ' + dm.getFullYear() : (dm.getMonth() === 0 ? ' ' + String(dm.getFullYear()).slice(2) : '')) : ''}</div>`;
    axes += `<div class="gaxe" style="left:${X(d)}px"></div>`; d = suivant;
  }
  let sem = '';
  if (s.echelle === 'semaine') { const dw = dateDe(debut); dw.setDate(dw.getDate() - ((dw.getDay() + 6) % 7)); let w = ISO(dw); while (w < fin) { if (w >= debut) sem += `<div class="gsem" style="left:${X(w)}px">${dateDe(w).getDate()}</div>`; w = plusJours(w, 7); } }
  corps.innerHTML = `<div class="actions" style="margin-bottom:.6em;font-size:.9em"><span class="muted">Échelle</span><select class="inline" id="t-ech">${[['semaine', 'Semaine'], ['mois', 'Mois'], ['trimestre', 'Trimestre']].map(([k, l]) => `<option value="${k}" ${s.echelle === k ? 'selected' : ''}>${l}</option>`).join('')}</select><button class="btn sm" id="t-auj">Aujourd’hui</button><span class="muted sm">Glissez une barre pour la décaler, tirez son bord droit pour l’allonger, cliquez pour ouvrir.</span></div>
    <div class="gantt" id="gantt"><div class="gbody" style="width:calc(16em + ${W}px)">
      <div class="glignes" style="width:${W}px">${axes}<div class="gauj" style="left:${X(a)}px" title="Aujourd’hui"></div></div>
      <div class="gtete grow"><div class="glab">Phases et tâches</div><div class="gbars" style="width:${W}px;height:2.6em">${mois}${sem}</div></div>
      ${lignes.map(li => ligneGantt(li, X, PX, W)).join('')}</div></div>`;
  $('#t-ech').addEventListener('change', e => { s.echelle = e.target.value; memoSuivi(); rendreSuivi(); });
  const g = $('#gantt'); const centrer = () => { g.scrollLeft = Math.max(0, X(a) - g.clientWidth / 3 + 16 * 12); };
  centrer(); $('#t-auj').addEventListener('click', centrer);

function ligneGantt(li, X, PX, W) {
  const s = state.suivi;
  if (li.type === 'projet') return `<div class="grow gpr"><div class="glab">${esc(li.l)}</div><div class="gbars" style="width:${W}px"></div></div>`;
  if (li.type === 'groupe') return `<div class="grow gph"><div class="glab"><button class="tog" data-plie="${li.id}">${s.plies[li.id] ? '▸' : '▾'}</button><span class="lib">${esc(li.l)}</span><span class="n muted">${li.n}</span></div><div class="gbars" style="width:${W}px"></div></div>`;
  if (li.type === 'phase') {
    const ph = li.ph; const deb = ph.start_on || auj(); const finP = ph.end_on || plusJours(deb, 120); const pr = progPhase(ph);
    return `<div class="grow gph"><div class="glab"><button class="tog" data-plie="${ph.id}">${s.plies[ph.id] ? '▸' : '▾'}</button><span class="lib" data-phase-ouvrir="${ph.id}" title="${esc(ph.title)}">${ph.num}. ${esc(ph.title)}</span><span class="n muted">${li.n || ''}</span></div>
      <div class="gbars" style="width:${W}px">${barreGantt({ cls: `phase ${ph.end_on ? '' : 'ouvert'} ${ph.status === 'terminée' ? 'fait' : ''}`, attr: `data-gph="${ph.id}"`, deb, fin: finP, X, PX, pct: pr, lib: `${ph.title} · ${pr} %` })}</div></div>`;
  }
  const t = li.t; const cls = t.status === 'fait' ? 'fait' : enRetard(t) ? 'retard' : t.status === 'en cours' ? 'encours' : '';
  let bar = '';
  const qui = t.assignee ? membre(t.assignee).name.split(' ')[0] : null;
  if (t.due_on && t.start_on && t.start_on < t.due_on) bar = barreGantt({ cls, attr: `data-gt="${t.id}"`, deb: t.start_on, fin: t.due_on, X, PX, pct: t.status === 'fait' ? 100 : t.progress || 0, lib: t.title + (qui ? ' · ' + qui : ''), titre: `${t.title} · ${dateFr(t.start_on)} → ${dateFr(t.due_on)}` });
  else if (t.due_on) bar = `<div class="gjalon ${cls}" data-gt="${t.id}" data-deb="${t.due_on}" data-fin="${t.due_on}" style="left:${X(t.due_on) + PX / 2}px" title="${esc(t.title)} · ${dateFr(t.due_on)}"></div><span class="glib" style="left:${X(t.due_on) + PX / 2 + 14}px">${esc(t.title)}${qui ? ' · ' + esc(qui) : ''} · ${dateFr(t.due_on, { annee: false })}</span>`;
  return `<div class="grow"><div class="glab"><span class="pl lib" data-ouvrir="${t.id}" title="${esc(t.title)}">${avatarDe(t.assignee)} ${esc(t.title)}</span></div><div class="gbars" style="width:${W}px">${bar || `<button class="btn sm gplan" data-planifier="${t.id}" style="left:${X(auj()) + 6}px">Planifier</button>`}</div></div>`;
}
function barreGantt({ cls, attr, deb, fin, X, PX, pct, lib, titre }) {
  const left = X(deb), w = Math.max(8, (diffJours(deb, fin) + 1) * PX); const dedans = w > Math.min(220, lib.length * 6.2 + 16);
  return `<div class="gbar ${cls}" ${attr} data-deb="${deb}" data-fin="${fin}" style="left:${left}px;width:${w}px" title="${esc(titre || lib)}"><i style="width:${pct}%"></i>${dedans ? `<span>${esc(lib)}</span>` : ''}<div class="gh"></div></div>${dedans ? '' : `<span class="glib" style="left:${left + w + 6}px">${esc(lib)}</span>`}`;
}
function brancherGantt(corps, PX) {
  $$('[data-plie]', corps).forEach(b => b.addEventListener('click', () => { const s = state.suivi; s.plies[b.dataset.plie] = !s.plies[b.dataset.plie]; rendreSuivi(); }));
  $$('[data-planifier]', corps).forEach(b => b.addEventListener('click', async () => { await sauverTache(b.dataset.planifier, { start_on: auj(), due_on: plusJours(auj(), 7) }); rendreSuivi(); }));
  $$('.gbar,.gjalon', corps).forEach(el => {
    el.addEventListener('pointerdown', e => {
      if (e.button) return;
      const resize = e.target.classList.contains('gh');
      const x0 = e.clientX, deb = el.dataset.deb, fin = el.dataset.fin, left0 = parseFloat(el.style.left), w0 = parseFloat(el.style.width) || 0;
      let delta = 0, bouge = false;
      try { el.setPointerCapture(e.pointerId); } catch (x) { }
      const move = ev => {
        const dx = ev.clientX - x0; if (Math.abs(dx) > 4) bouge = true; delta = Math.round(dx / PX);
        if (resize) { delta = Math.max(delta, -diffJours(deb, fin)); el.style.width = Math.max(PX, w0 + delta * PX) + 'px'; el.title = 'Fin : ' + dateFr(plusJours(fin, delta)); }
        else { el.style.left = (left0 + delta * PX) + 'px'; el.title = deb === fin ? dateFr(plusJours(fin, delta)) : dateFr(plusJours(deb, delta)) + ' → ' + dateFr(plusJours(fin, delta)); }
      };
      const up = async () => {
        el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up);
        if (!bouge) { if (el.dataset.gt) ouvrirTache(el.dataset.gt); else formPhase(el.dataset.gph); return; }
        if (!delta) { rendreSuivi(); return; }
        if (el.dataset.gt) {
          const t = state.taches.find(x => x.id === el.dataset.gt); if (!t) return;
          const patch = resize ? { due_on: plusJours(fin, delta) } : { due_on: plusJours(fin, delta), ...(t.start_on ? { start_on: plusJours(deb, delta) } : {}) };
          await sauverTache(t.id, patch);
        } else {
          const ph = phaseDe(el.dataset.gph); if (!ph) return;
          const patch = resize ? { end_on: plusJours(fin, delta) } : { start_on: plusJours(deb, delta), ...(ph.end_on ? { end_on: plusJours(fin, delta) } : {}) };
          await sauverPhase(ph.id, patch);
        }
        rendreSuivi();
      };
      el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
      e.preventDefault();
    });
  });
}

/* ---- Calendrier ---- */
function rendreCalendrier(corps) {
  const s = state.suivi; const [Y, M] = s.mois.split('-').map(Number); const a = auj();
  const premier = new Date(Y, M - 1, 1); const start = new Date(Y, M - 1, 1 - ((premier.getDay() + 6) % 7));
  const ts = tachesVisibles(true); const phs = state.phases.filter(p => state.filtreProjet === 'tous' || p.project_id === state.filtreProjet);
  let cells = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i); const iso = ISO(d); const hors = d.getMonth() !== M - 1;
    const x = ts.filter(t => t.due_on === iso).sort(triTaches);
    const pd = phs.filter(p => p.start_on === iso).map(p => ({ p, l: '▶ Ph. ' + p.num })).concat(phs.filter(p => p.end_on === iso).map(p => ({ p, l: '■ Fin ph. ' + p.num })));
    const chips = pd.map(({ p, l }) => `<span class="chip ph" data-phase-ouvrir="${p.id}" title="${esc(p.title)}">${l}</span>`)
      .concat(x.slice(0, 3).map(t => `<span class="chip ${t.status === 'fait' ? 'fait' : enRetard(t) ? 'retard' : ''}" data-ouvrir="${t.id}" title="${esc(t.title)}${t.assignee ? ' · ' + esc(membre(t.assignee).name) : ''}">${esc(t.title)}</span>`));
    cells += `<div class="cc ${hors ? 'hors' : ''} ${iso === a ? 'auj' : ''} ${d.getDay() === 0 || d.getDay() === 6 ? 'we' : ''}" data-jour="${iso}"><span class="jn">${d.getDate()}</span>${chips.join('')}${x.length > 3 ? `<button class="plus" data-jour-liste="${iso}">+${x.length - 3} autres</button>` : ''}</div>`;
  }
  corps.innerHTML = `<div class="cal-nav"><button class="btn sm" id="c-prev" title="Mois précédent">◀</button><button class="btn sm" id="c-auj">Aujourd’hui</button><button class="btn sm" id="c-next" title="Mois suivant">▶</button><h2>${MOIS_LONG[M - 1]} ${Y}</h2><span class="muted sm">Cliquez un jour pour créer une tâche à cette date.</span></div>
    <div class="cal">${['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'].map(j => `<div class="cj">${j}</div>`).join('')}${cells}</div>`;
  const nav = n => { const d = new Date(Y, M - 1 + n, 1); s.mois = ISO(d).slice(0, 7); rendreSuivi(); };
  $('#c-prev').addEventListener('click', () => nav(-1)); $('#c-next').addEventListener('click', () => nav(1));
  $('#c-auj').addEventListener('click', () => { s.mois = a.slice(0, 7); rendreSuivi(); });
  $$('.cc', corps).forEach(c => c.addEventListener('click', e => { if (e.target.closest('.chip,.plus')) return; formTache({ due_on: c.dataset.jour }); }));
  $$('[data-jour-liste]', corps).forEach(b => b.addEventListener('click', () => listeJour(b.dataset.jourListe)));
}
function listeJour(iso) {
  const x = tachesVisibles(true).filter(t => t.due_on === iso).sort(triTaches);
  modal(`<h3>${dateFr(iso, { jour: true })}</h3><div>${x.map(ligneTache).join('') || '<div class="vide">Aucune tâche.</div>'}</div>
    <div class="actions" style="margin-top:.8em"><button class="btn prim" id="j-add">＋ Tâche ce jour</button><button class="btn" onclick="fermerModal()">Fermer</button></div>`, mo => {
    brancherCommun(mo); $('#j-add', mo).addEventListener('click', () => formTache({ due_on: iso }));
  });
}

    <div class="actions"><button class="btn prim" id="n-ok">Créer</button><button class="btn" onclick="fermerModal()">Annuler</button></div>`, mo => {

      <label class="champ"><span>Priorité</span><select id="f-prio">${PRIOS.map(([k, l]) => `<option value="${k}" ${t.priority === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>

  const chan = state.client.channel('kp-doc-' + doc.id, { config: { broadcast: { self: false }, presence: { key: String(s.monId) } } });
  s.chan = chan;
  chan.on('broadcast', { event: 'u' }, ({ payload }) => { try { Y.applyUpdate(ydoc, b64ToU8(payload.u), 'remote'); } catch (e) { console.error(e); } })
    .on('broadcast', { event: 'a' }, ({ payload }) => { try { KP.applyAw(awareness, b64ToU8(payload.a), 'remote'); } catch (e) { } })
    .on('broadcast', { event: 'sync-req' }, ({ payload }) => { chan.send({ type: 'broadcast', event: 'sync-res', payload: { to: payload.from, s: u8ToB64(Y.encodeStateAsUpdate(ydoc)) } }); if (awareness.getLocalState()) chan.send({ type: 'broadcast', event: 'a', payload: { a: u8ToB64(KP.encodeAw(awareness, [ydoc.clientID])) } }); })

  state.redac.session = null; state.redac.ouvert = null;
  clearTimeout(s.timer);
  try { if (s.dirty) { s.dirty = true; const html = s.quill.getSemanticHTML(); const ystate = u8ToB64(KP.Y.encodeStateAsUpdate(s.ydoc)); await state.client.from('kp_docs').update({ content_html: html, ystate, updated_by: state.moi.user_id, updated_at: new Date().toISOString() }).eq('id', s.id); } } catch (e) { }
  try { KP.removeAw(s.awareness, [s.ydoc.clientID], 'app'); } catch (e) { }
  try { s.binding.destroy(); } catch (e) { }
  try { await s.chan.untrack(); state.client.removeChannel(s.chan); } catch (e) { }
  try { s.ydoc.destroy(); } catch (e) { }
}
window.addEventListener('pagehide', () => { const s = state.redac.session; if (s?.dirty) { s.dirty = false; sauverDoc(Object.assign(s, { dirty: true })); } });

/* ============================================================
   Budget : lignes prévisionnelles (dépenses, recettes), engagements, paiements, encaissements, journal
   ============================================================ */
const CAT_DEP = ['Foncier', 'Études et diagnostics', 'Honoraires (architecte, BET, contrôle)', 'Autorisations et taxes', 'Travaux gros œuvre', 'Travaux second œuvre', 'VRD et aménagements extérieurs', 'Frais financiers', 'Commercialisation', 'Frais généraux et pilotage', 'Aléas'];
const CAT_REC = ['Ventes VEFA', 'Ventes après livraison', 'Loyers et exploitation', 'Apports et subventions', 'Autres recettes'];
const TYPES_MVT = { engagement: ['Engagement', 'bleu'], paiement: ['Paiement', ''], encaissement: ['Encaissement', 'ambre'] };
state.budget = { lignes: [], mouvements: [], journal: null, projet: localStorage.getItem('kp.budget.projet') || 'kaporo1', onglet: localStorage.getItem('kp.budget.onglet') || 'synthese', devise: localStorage.getItem('kp.budget.devise') || 'GNF', ligne: null };
const projetBudget = () => state.projets.find(p => p.id === state.budget.projet) || state.projets[0];
const taux = () => Number(projetBudget()?.gnf_per_eur) || 9600;
const enDevise = n => state.budget.devise === 'EUR' ? (Number(n) || 0) / taux() : (Number(n) || 0);
const symDevise = () => state.budget.devise === 'EUR' ? '€' : 'GNF';
const fmtM = n => Math.round(enDevise(n)).toLocaleString('fr-FR') + ' ' + symDevise();
function abr(n) {
  const v = enDevise(n), a = Math.abs(v), d = symDevise();
  if (a >= 1e9) return (v / 1e9).toLocaleString('fr-FR', { maximumFractionDigits: 2 }) + ' Md ' + d;
  if (a >= 1e6) return (v / 1e6).toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' M ' + d;
  if (a >= 1e4) return (v / 1e3).toLocaleString('fr-FR', { maximumFractionDigits: 0 }) + ' k ' + d;
  return Math.round(v).toLocaleString('fr-FR') + ' ' + d;
}
const parseMontant = v => { const n = Number(String(v).replace(/\s| | /g, '').replace(',', '.')); if (isNaN(n)) return NaN; return state.budget.devise === 'EUR' ? Math.round(n * taux()) : Math.round(n); };
const pct = (a, b) => b ? Math.round(a * 100 / b) : 0;
const somme = (arr, f) => arr.reduce((s, x) => s + (Number(f ? f(x) : x) || 0), 0);
const mvtsDe = id => state.budget.mouvements.filter(m => m.line_id === id);
const typeRealise = l => l.kind === 'recette' ? 'encaissement' : 'paiement';
function totauxLigne(l) { const ms = mvtsDe(l.id); return { prevu: Number(l.planned) || 0, engage: somme(ms.filter(m => m.type === 'engagement'), m => m.amount), realise: somme(ms.filter(m => m.type === typeRealise(l)), m => m.amount) }; }
function totaux(lignes) { return lignes.reduce((t, l) => { const x = totauxLigne(l); t.prevu += x.prevu; t.engage += x.engage; t.realise += x.realise; return t; }, { prevu: 0, engage: 0, realise: 0 }); }
const lignesProjet = () => state.budget.lignes.filter(l => l.project_id === state.budget.projet).sort((a, b) => (a.kind > b.kind ? 1 : a.kind < b.kind ? -1 : 0) || a.category.localeCompare(b.category) || (a.sort - b.sort) || a.label.localeCompare(b.label));
const memoBudget = () => { const b = state.budget; localStorage.setItem('kp.budget.projet', b.projet); localStorage.setItem('kp.budget.onglet', b.onglet); localStorage.setItem('kp.budget.devise', b.devise); };

/* ---- Vue ---- */
const ONGLETS_BUDGET = [['synthese', 'Synthèse'], ['depenses', 'Dépenses'], ['recettes', 'Recettes'], ['mouvements', 'Mouvements'], ['journal', 'Journal']];

      <div class="actions"><button class="btn prim" id="b-ligne">＋ Ligne</button><button class="btn" id="b-mvt">＋ Mouvement</button><button class="btn" id="b-csv">⬇ CSV</button></div></div>

function rendreBudget() {
  const corps = $('#budget-corps'); if (!corps) return;
  ({ synthese: rendreSynthese, depenses: c => rendreLignes(c, 'dépense'), recettes: c => rendreLignes(c, 'recette'), mouvements: rendreMouvements, journal: rendreJournal }[state.budget.onglet] || rendreSynthese)(corps);
  $$('[data-ligne]', corps).forEach(el => el.addEventListener('click', e => { if (e.target.closest('button')) return; ficheLigne(el.dataset.ligne); }));
  $$('[data-mvt-suppr]', corps).forEach(x => x.addEventListener('click', () => supprimerMouvement(x.dataset.mvtSuppr)));
}
function rendreSynthese(corps) {
  const ls = lignesProjet(); const dep = ls.filter(l => l.kind === 'dépense'), rec = ls.filter(l => l.kind === 'recette');
  const td = totaux(dep), tr = totaux(rec);
  const marge = tr.prevu - td.prevu; const treso = tr.realise - td.realise;
  const parCat = (lignes, cats) => [...new Set([...cats, ...lignes.map(l => l.category)])].map(c => [c, lignes.filter(l => l.category === c)]).filter(([, x]) => x.length).map(([c, x]) => ({ c, ...totaux(x), n: x.length }));
  const tableau = (titre, rows, total, kind) => `<div class="carte"><h3>${titre} <small>${rows.reduce((s, r) => s + r.n, 0)} ligne${rows.reduce((s, r) => s + r.n, 0) > 1 ? 's' : ''}</small></h3>
    ${rows.length ? `<table class="tb"><thead><tr><th>Poste</th><th class="num">Prévu</th><th class="num">Engagé</th><th class="num">${kind === 'recette' ? 'Encaissé' : 'Payé'}</th><th class="num">Reste</th><th style="width:7em"></th></tr></thead><tbody>
      ${rows.map(r => `<tr><td>${esc(r.c)}</td><td class="num">${fmtM(r.prevu)}</td><td class="num ${r.engage > r.prevu ? 'dep' : ''}">${fmtM(r.engage)}</td><td class="num">${fmtM(r.realise)}</td><td class="num">${fmtM(r.prevu - r.engage)}</td><td>${jauge(pct(r.realise, r.prevu), kind === 'recette' ? 'or' : '')}<small class="muted">${pct(r.realise, r.prevu)} %</small></td></tr>`).join('')}
      <tr class="total"><td>Total</td><td class="num">${fmtM(total.prevu)}</td><td class="num">${fmtM(total.engage)}</td><td class="num">${fmtM(total.realise)}</td><td class="num">${fmtM(total.prevu - total.engage)}</td><td></td></tr></tbody></table>` : `<div class="vide">Aucune ligne. <button class="btn sm" data-structure="${kind}">Créer la structure type</button></div>`}</div>`;
  const depassements = dep.map(l => ({ l, ...totauxLigne(l) })).filter(x => x.engage > x.prevu);
  const derniers = state.budget.mouvements.filter(m => ls.find(l => l.id === m.line_id)).sort((a, b) => b.on_date.localeCompare(a.on_date) || b.created_at.localeCompare(a.created_at)).slice(0, 6);

      <div class="kpi"><b>${abr(td.engage)}</b><small>Engagé · ${pct(td.engage, td.prevu)} %</small>${jauge(pct(td.engage, td.prevu), 'bleu')}</div>
      <div class="kpi"><b>${abr(td.realise)}</b><small>Payé · ${pct(td.realise, td.prevu)} %</small>${jauge(pct(td.realise, td.prevu))}</div>
      <div class="kpi"><b>${abr(tr.prevu)}</b><small>Recettes prévues</small></div>
      <div class="kpi"><b>${abr(tr.realise)}</b><small>Encaissé · ${pct(tr.realise, tr.prevu)} %</small>${jauge(pct(tr.realise, tr.prevu), 'or')}</div>
      <div class="kpi ${marge < 0 ? 'rouge' : 'vert'}"><b>${abr(marge)}</b><small>Marge prévisionnelle · ${pct(marge, td.prevu)} %</small></div>
      <div class="kpi ${treso < 0 ? 'rouge' : ''}"><b>${abr(treso)}</b><small>Trésorerie à date</small></div></div>
    ${depassements.length ? `<div class="carte accent" style="margin-bottom:1em"><h3>Dépassements <small>${depassements.length}</small></h3>${depassements.map(x => `<div class="ligne" data-ligne="${x.l.id}" style="cursor:pointer"><div><b class="sm">${esc(x.l.label)}</b><small>${esc(x.l.category)}</small></div><span class="etat rouge">+ ${fmtM(x.engage - x.prevu)}</span></div>`).join('')}</div>` : ''}
    <div class="g g2">${tableau('Dépenses par poste', parCat(dep, CAT_DEP), td, 'dépense')}${tableau('Recettes par poste', parCat(rec, CAT_REC), tr, 'recette')}
      <div class="carte"><h3>Derniers mouvements</h3>${derniers.length ? derniers.map(ligneMouvement).join('') : '<div class="vide">Aucun mouvement.</div>'}</div>

  $$('[data-structure]', corps).forEach(x => x.addEventListener('click', () => creerStructureType(x.dataset.structure)));

function rendreLignes(corps, kind) {

    ${cats.map(([c, x]) => { const tc = totaux(x); return `<tr class="cat"><td>${esc(c)} <small class="muted">${x.length}</small></td><td class="num">${fmtM(tc.prevu)}</td><td class="num">${fmtM(tc.engage)}</td><td class="num">${fmtM(tc.realise)}</td><td class="num">${fmtM(tc.prevu - tc.engage)}</td><td></td></tr>${x.map(row).join('')}`; }).join('')}
    <tr class="total"><td>Total ${kind === 'recette' ? 'recettes' : 'dépenses'}</td><td class="num">${fmtM(t.prevu)}</td><td class="num">${fmtM(t.engage)}</td><td class="num">${fmtM(t.realise)}</td><td class="num">${fmtM(t.prevu - t.engage)}</td><td></td></tr></tbody></table>` : `<div class="vide">Aucune ligne de ${kind}. <button class="btn sm" data-structure="${kind}">Créer la structure type</button> ou ajoutez une ligne.</div>`}
    <p class="sm muted" style="margin-top:.6em">Cliquez une ligne pour la modifier ou saisir un mouvement.</p></div>`;
  $$('[data-structure]', corps).forEach(x => x.addEventListener('click', () => creerStructureType(x.dataset.structure)));
}
function ligneMouvement(m) {
  const l = state.budget.lignes.find(x => x.id === m.line_id); const [lib, cls] = TYPES_MVT[m.type] || [m.type, 'gris'];
  return `<div class="ligne mvt"><div style="min-width:0"><b class="sm">${esc(m.label || (l ? l.label : ''))}</b><small>${dateFr(m.on_date)} · ${l ? esc(l.label) + ' · ' : ''}${esc(membre(m.created_by).name)}${m.ref ? ' · réf. ' + esc(m.ref) : ''}</small></div>

function rendreMouvements(corps) {

async function rendreJournal(corps) {

  if (error) { corps.innerHTML = '<div class="vide">Journal indisponible.</div>'; return; }
  const lib = e => { const d = e.detail || {}; const a = { insert: 'a créé', update: 'a modifié', delete: 'a supprimé' }[e.action] || e.action;

    const [t] = TYPES_MVT[d.type] || [d.type]; return `${a} un ${(t || '').toLowerCase()} de ${fmtM(d.amount)}${d.label ? ' « ' + esc(d.label) + ' »' : ''}${d.on_date ? ' au ' + dateFr(d.on_date) : ''}`; };
  corps.innerHTML = `<div class="carte">${data.length ? data.map(e => `<div class="ligne"><div><b class="sm">${esc(membre(e.who).name)}</b> <span class="sm">${lib(e)}</span><small>${dateFr(e.at)} ${hhmm(new Date(e.at))}</small></div></div>`).join('') : '<div class="vide">Aucune modification enregistrée.</div>'}</div>`;

/* ---- Formulaires ---- */
const optionsCat = (kind, sel) => [...new Set([...(kind === 'recette' ? CAT_REC : CAT_DEP), ...state.budget.lignes.filter(l => l.kind === kind).map(l => l.category), ...(sel ? [sel] : [])])].map(c => `<option ${c === sel ? 'selected' : ''}>${esc(c)}</option>`).join('');
const champMontant = (id, val, lib = 'Montant') => `<label class="champ"><span>${lib} (${symDevise()})</span><input id="${id}" inputmode="decimal" value="${val !== undefined && val !== null ? Math.round(enDevise(val)).toLocaleString('fr-FR') : ''}" placeholder="0"></label>`;

}
function formMouvement(pre = {}) {
  const ls = lignesProjet(); if (!ls.length) { toast('Créez d’abord une ligne de budget'); return; }

function exporterBudgetCSV() {

  const col = ['Nature', 'Poste', 'Libellé', 'Fournisseur', 'Phase', 'Prévu (GNF)', 'Engagé (GNF)', 'Réalisé (GNF)', 'Reste (GNF)', 'Note'];

  const ms = state.budget.mouvements.filter(m => ls.find(l => l.id === m.line_id)).sort((a, b) => a.on_date.localeCompare(b.on_date));

  const rows2 = ms.map(m => { const l = ls.find(x => x.id === m.line_id); return [m.on_date, m.type, l ? l.label : '', m.label || '', m.ref || '', m.amount, membre(m.created_by).name].map(q).join(';'); });

  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `kaporo-budget-${state.budget.projet}-${auj()}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);

    if (error) { let code = ''; try { code = (await error.context?.json())?.error || ''; } catch (e) { } throw new Error(code || error.message); }
    if (!data?.html) throw new Error('Réponse vide');
    await enregistrerCR(m, data.html, true); rendreReunion(); toast('<b>Compte rendu rédigé.</b> Relisez-le, puis envoyez-le.', 5000);
  } catch (e) {
    console.error(e); const msg = String(e.message || e);
    toast(msg === 'CLE_MANQUANTE' ? '<b>IA non configurée.</b> L’administrateur doit enregistrer la clé ANTHROPIC_API_KEY dans Supabase (Edge Functions → Secrets).' : msg === 'NON_AUTHENTIFIE' ? 'Session expirée : reconnectez-vous.' : '<b>Rédaction impossible.</b> ' + esc(msg), 8000);
  }
  if (b) b.disabled = false;
}
async function ouvrirDocCR(m) {
  if (!m.minutes_doc_id) { const d = await creerDoc({ title: `CR — ${m.title} — ${dateFr(m.starts_at)}`, project_id: m.project_id, category: 'Compte rendu', content_html: m.minutes_html }); if (!d) return; await majReunion(m, { minutes_doc_id: d.id }); }
  fermerReunion(); go('redaction'); ouvrirDoc(m.minutes_doc_id);
}
function htmlVersTexte(html) {
  const d = document.createElement('div'); d.innerHTML = html;
  d.querySelectorAll('script,style').forEach(e => e.remove());
  d.querySelectorAll('li').forEach(e => e.prepend('• ')); d.querySelectorAll('td,th').forEach(e => e.append(' | '));
  d.querySelectorAll('h1,h2,h3,p,li,tr,div,br').forEach(e => e.append('\n')); d.querySelectorAll('h1,h2,h3').forEach(e => { e.prepend('\n'); e.append('\n'); });
  return d.textContent.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
}
function envoyerCR(m) {
  const texte = htmlVersTexte(m.minutes_html); const sujet = `Compte rendu — ${m.title} — ${dateFr(m.starts_at)}`;
  const emails = (m.participants || []).map(id => membre(id).email).filter(Boolean);
  const canal = state.canaux.find(c => c.project_id === m.project_id && c.kind !== 'prive') || state.canaux.find(c => c.kind === 'general');
  modal(`<h3>Envoyer le compte rendu</h3>
    <div class="plus-liste">
      <button class="btn" id="e-chat">💬 Publier dans Discussions <small class="muted">· ${esc(canal?.name || 'canal')}</small></button>
      <button class="btn" id="e-mail">✉️ E-mail aux participants <small class="muted">· ${emails.length} adresse${emails.length > 1 ? 's' : ''}</small></button>
      <button class="btn" id="e-copie">📋 Copier le texte</button>
      <button class="btn" id="e-word">⬇ Télécharger en Word</button></div>
    <p class="sm muted" style="margin-top:.8em">L’e-mail s’ouvre dans votre messagerie avec le texte prérempli ; joignez le fichier Word si besoin.</p>
    <div class="actions" style="margin-top:.6em"><button class="btn" onclick="fermerModal()">Fermer</button></div>`, mo => {
    $('#e-chat', mo).addEventListener('click', async () => {
      if (!canal) { toast('Aucun canal disponible'); return; }
      const body = `📋 ${sujet}\n\n${texte.slice(0, 3500)}${texte.length > 3500 ? '\n\n[…] Compte rendu complet dans le module Réunions.' : ''}`;
      const { data, error } = await state.client.from('kp_messages').insert({ channel_id: canal.id, author: state.moi.user_id, body, mentions: [] }).select().single();
      if (error) { toast('Publication impossible'); return; }
      if (!state.messages.find(x => x.id === data.id)) state.messages.push(data);
      await majReunion(m, { minutes_sent_at: new Date().toISOString() }); fermerModal(); toast(`Publié dans « ${esc(canal.name)} »`); rendreReunion();
    });
    $('#e-mail', mo).addEventListener('click', async () => {
      const corps = texte.length > 1700 ? texte.slice(0, 1700) + '\n\n[…] Compte rendu complet dans Kaporo (module Réunions) ou en pièce jointe.' : texte;
      window.location.href = `mailto:${emails.join(',')}?subject=${encodeURIComponent(sujet)}&body=${encodeURIComponent(corps)}`;
      await majReunion(m, { minutes_sent_at: new Date().toISOString() }); fermerModal(); rendreReunion();
    });
    $('#e-copie', mo).addEventListener('click', async () => { try { await navigator.clipboard.writeText(texte); toast('Texte copié'); } catch (e) { toast('Copie impossible'); } });
    $('#e-word', mo).addEventListener('click', () => exporterWord(m.minutes_html, sujet));
  });
}

/* ============================================================
   Navigation, chargement des données, temps réel, démarrage
   ============================================================ */
const VUES = [
  ['discussions', '💬', 'Discussions', vueDiscussions], ['projets', '🏗️', 'Projets', vueProjets], ['documents', '📁', 'Documents', vueDocuments],
  ['decisions', '✅', 'Décisions', vueDecisions], ['taches', '📊', 'Suivi', vueTaches], ['reunions', '🗓️', 'Réunions', vueReunions], ['redaction', '📝', 'Rédaction', vueRedaction], ['budget', '💰', 'Budget', vueBudget],
  ['equipe', '👥', 'Équipe', vueEquipe], ['dev', '🛠️', 'Développement', vueDev, 'admin'],
];
const TABS_MOBILE = ['discussions', 'taches', 'reunions', 'redaction'];
const vuesVisibles = () => VUES.filter(v => !v[4] || (state.moi && state.moi.is_admin));
function renderNav() {
  const nl = totalNonLus(); const auj = new Date().toISOString().slice(0, 10);
  const retard = state.taches.filter(t => t.status !== 'fait' && t.due_on && t.due_on < auj).length;
  const enCours = (state.reunions || []).filter(m => m.status === 'en cours').length;
  const badge = k => k === 'discussions' && nl ? `<span class="bd">${nl}</span>` : k === 'taches' && retard ? `<span class="bd">${retard}</span>` : k === 'reunions' && enCours ? `<span class="bd" title="Réunion en cours">▶</span>` : '';
  const devOuv = (state.dev || []).filter(d => ['question', 'livrée'].includes(d.status) && !d.vu).length;
  const btn = (k, court) => `<button class="${state.vue === k[0] ? 'on' : ''}" data-v="${k[0]}"><span class="ic">${k[1]}</span><span>${court && k[2] === 'Développement' ? 'Dév.' : k[2]}</span>${badge(k[0])}</button>`;
  const vs = vuesVisibles();
  $('#nav').innerHTML = `<div class="grp">Espace de travail</div>${vs.map(k => btn(k, false)).join('')}`;
  const princ = vs.filter(k => TABS_MOBILE.includes(k[0])); const autres = vs.filter(k => !TABS_MOBILE.includes(k[0]));
  const badgeAutres = autres.some(k => badge(k[0])) ? '<span class="bd">•</span>' : '';
  $('#tabs').innerHTML = princ.map(k => btn(k, true)).join('') + `<button class="${autres.some(k => k[0] === state.vue) ? 'on' : ''}" id="tab-plus"><span class="ic">⋯</span><span>Plus</span>${badgeAutres}</button>`;
  $('#tabs').style.gridTemplateColumns = `repeat(${princ.length + 1},1fr)`;
  $$('#nav button,#tabs button[data-v]').forEach(b => b.addEventListener('click', () => go(b.dataset.v)));
  $('#tab-plus').addEventListener('click', () => modal(`<h3>Autres modules</h3><div class="plus-liste">${autres.map(k => `<button class="btn ${state.vue === k[0] ? 'prim' : ''}" data-v="${k[0]}"><span class="ic">${k[1]}</span> ${k[2]}${badge(k[0])}</button>`).join('')}</div>`, mo => { $$('[data-v]', mo).forEach(b => b.addEventListener('click', () => go(b.dataset.v))); }));
  const a = $('#moi-avatar'); if (state.moi) { a.textContent = initiales(state.moi.name); a.style.background = state.moi.color; a.title = state.moi.name; }
  document.title = (nl ? `(${nl}) ` : '') + 'Kaporo';
}
function go(v) {
  if (state.redac?.session) fermerDoc();
  if (state.reunion?.ouverte) fermerReunion();
  state.vue = v; localStorage.setItem('kp.vue', v); fermerModal();
  const def = VUES.find(x => x[0] === v) || VUES[0];
  renderNav(); def[3]();
}
function setConn(ok, lib) { const c = $('#conn'); c.className = 'pill ' + (ok ? 'on' : 'off'); c.innerHTML = '<i></i><span>' + (lib || (ok ? 'En direct' : 'Hors ligne')) + '</span>'; }

async function chargerTout() {
  const c = state.client;
  const [me, mb, pr, ch, ms, rd, dc, de, ph, ta, cm, dx, bl, bm, mt] = await Promise.all([
    c.from('kp_members').select('*').eq('user_id', state.session.user.id).maybeSingle(),
    c.from('kp_members').select('*').order('created_at'),
    c.from('kp_projects').select('*').order('sort'),
    c.from('kp_channels').select('*').order('sort'),
    c.from('kp_messages').select('*').order('created_at', { ascending: true }).limit(2000),
    c.from('kp_reads').select('*').eq('user_id', state.session.user.id),
    c.from('kp_documents').select('*').order('created_at', { ascending: false }),
    c.from('kp_decisions').select('*').order('decided_on', { ascending: false }),
    c.from('kp_phases').select('*').order('num'),
    c.from('kp_tasks').select('*').order('created_at'),
    c.from('kp_channel_members').select('*'),
    c.from('kp_docs').select('id,project_id,title,category,created_by,created_at,updated_by,updated_at,archived').order('updated_at', { ascending: false }),
    c.from('kp_budget_lines').select('*').order('sort'),
    c.from('kp_budget_moves').select('*').order('on_date'),
    c.from('kp_meetings').select('*').order('starts_at'),
  ]);
  const err = [me, mb, pr, ch, ms, rd, dc, de, ph, ta, cm, dx, bl, bm, mt].find(r => r.error); if (err) throw err.error;
  state.docs = dx.data; state.budget.lignes = bl.data; state.budget.mouvements = bm.data; state.reunions = mt.data;
  if (!me.data) throw new Error('PROFIL_ABSENT');
  state.moi = me.data; state.membres = mb.data; state.projets = pr.data; state.canaux = ch.data; state.messages = ms.data;
  state.participants = grouperParticipants(cm.data);
  state.lectures = Object.fromEntries((rd.data || []).map(r => [r.channel_id, r.last_read]));
  state.documents = dc.data; state.decisions = de.data; state.phases = ph.data; state.taches = ta.data;
}
const grouperParticipants = rows => (rows || []).reduce((o, r) => { (o[r.channel_id] = o[r.channel_id] || []).push(r.user_id); return o; }, {});
/* Canaux et participants : rechargés quand une conversation privée est créée (temps réel) */
let rechargementCanaux = null;
function rechargerCanaux() {
  if (rechargementCanaux) return rechargementCanaux;
  rechargementCanaux = (async () => {
    const [ch, cm, ms] = await Promise.all([
      state.client.from('kp_channels').select('*').order('sort'),
      state.client.from('kp_channel_members').select('*'),
      state.client.from('kp_messages').select('*').order('created_at', { ascending: true }).limit(2000),
    ]);
    if (ch.data) state.canaux = ch.data;
    if (cm.data) state.participants = grouperParticipants(cm.data);
    if (ms.data) { for (const m of ms.data) if (!state.messages.find(x => x.id === m.id)) state.messages.push(m); state.messages.sort((a, b) => a.created_at < b.created_at ? -1 : 1); }
    if (state.vue === 'discussions') { renderCanaux(); if (state.canal && !state.canaux.find(c => c.id === state.canal)) { state.canal = state.canaux[0]?.id; renderSalon(); } }
    renderNav();
  })().finally(() => { rechargementCanaux = null; });
  return rechargementCanaux;
}
function brancherTempsReel() {
  const c = state.client;
  const maj = (table, cle, tri) => async payload => {
    const row = payload.new?.id ? payload.new : null;
    if (payload.eventType === 'DELETE') { state[cle] = state[cle].filter(x => x.id !== payload.old.id); }
    else if (row) { const i = state[cle].findIndex(x => x.id === row.id); if (i >= 0) state[cle][i] = row; else state[cle].push(row); if (tri) state[cle].sort(tri); }
    rafraichirVue();
  };
  const rafraichirVue = () => {
    if (state.vue === 'redaction' && state.redac.session) return;
    if (state.vue === 'reunions' && state.reunion.ouverte) { renderNav(); return; }
    if (document.activeElement?.matches('input,select,textarea') || $('#modal') || state.vue === 'discussions') { renderNav(); return; }
    if (state.vue === 'taches' && $('#suivi-corps')) rendreSuivi(); else if (state.vue === 'budget' && $('#budget-corps')) rendreBudget(); else go(state.vue);
  };
  const majBudget = cle => payload => {
    const arr = state.budget[cle]; const row = payload.new?.id ? payload.new : null;
    if (payload.eventType === 'DELETE') { state.budget[cle] = arr.filter(x => x.id !== payload.old.id); if (cle === 'lignes') state.budget.mouvements = state.budget.mouvements.filter(m => m.line_id !== payload.old.id); }
    else if (row) { const i = arr.findIndex(x => x.id === row.id); if (i >= 0) arr[i] = row; else arr.push(row); }
    if (state.vue === 'budget' && !$('#modal')) rendreBudget(); else if (state.vue === 'budget' && state.budget.ligne) ficheLigne(state.budget.ligne);
  };
  c.channel('kaporo-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'kp_messages' }, p => { if (p.new?.id) messageRecu(p.new); })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'kp_channel_members' }, p => { if (p.new?.user_id === state.moi?.user_id) rechargerCanaux(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'kp_tasks' }, maj('kp_tasks', 'taches'))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'kp_decisions' }, maj('kp_decisions', 'decisions', (a, b) => b.decided_on.localeCompare(a.decided_on)))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'kp_documents' }, maj('kp_documents', 'documents', (a, b) => b.created_at.localeCompare(a.created_at)))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'kp_phases' }, maj('kp_phases', 'phases', (a, b) => a.num - b.num))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'kp_docs' }, p => { if (p.eventType === 'DELETE') { state.docs = state.docs.filter(d => d.id !== p.old.id); if (state.redac.session?.id === p.old.id) { toast('Ce document a été supprimé'); go('redaction'); } } else if (p.new?.id) docModifieAilleurs(p.new); if (state.vue === 'redaction' && !state.redac.session && !$('#modal')) vueRedaction(); })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'kp_doc_versions' }, p => { if (p.new?.id) versionRecue(p.new); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'kp_budget_lines' }, majBudget('lignes'))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'kp_budget_moves' }, majBudget('mouvements'))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'kp_meetings' }, reunionModifiee)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'kp_meeting_notes' }, noteRecue)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'kp_dev_requests' }, async p => {
      if (!state.moi?.is_admin) return; await chargerDev();
      if (p.new && ['question', 'livrée', 'erreur'].includes(p.new.status) && p.old?.status !== p.new.status) toast(`<b>Développement · ${esc(p.new.title)}</b><br>${p.new.status === 'livrée' ? 'Livrée : rechargez l’application pour voir le résultat.' : p.new.status === 'question' ? 'L’agent a une question.' : 'Erreur pendant la réalisation.'}`, 6000);
      if (state.vue === 'dev' && !document.activeElement?.matches('input,select,textarea')) vueDev(); else renderNav();
    })
    .subscribe(st => { setConn(st === 'SUBSCRIBED', st === 'SUBSCRIBED' ? 'En direct' : st === 'CHANNEL_ERROR' ? 'Reconnexion…' : 'Connexion…'); });
  // Nouveaux membres : rafraîchir la liste (pas de temps réel sur la table, on recharge à la demande)
  c.from('kp_members').select('*').order('created_at').then(r => { if (r.data) state.membres = r.data; });
}

async function demarrerSession(session) {
  state.session = session;
  try {
    await chargerTout();
  } catch (e) {
    console.error(e);
    if (String(e.message).includes('PROFIL_ABSENT')) { msgLogin('err', 'Votre compte existe mais n’est pas (ou plus) membre de cet espace. Contactez Paul.'); await state.client.auth.signOut(); return; }
    msgLogin('err', 'Chargement impossible : ' + esc(e.message)); return;
  }
  $('#login').hidden = true; $('#app').hidden = false;
  if (state.moi.is_admin) await chargerDev();
  go(vuesVisibles().find(v => v[0] === state.vue) ? state.vue : 'discussions');
  brancherTempsReel();
  if (state.vue === 'discussions' && window.matchMedia('(max-width:820px)').matches && totalNonLus() === 0 && state.canal) { /* on reste sur la liste des canaux */ }
}
(function boot() {
  state.client = supabase.createClient(SUPA.url, SUPA.key, { auth: { flowType: 'implicit', persistSession: true, detectSessionInUrl: true }, realtime: { params: { eventsPerSecond: 10 } } });
  initLogin();
  let demarre = false;
  state.client.auth.onAuthStateChange((evt, session) => {
    if (session && !demarre) { demarre = true; demarrerSession(session); }
    if (evt === 'SIGNED_OUT') { demarre = false; $('#app').hidden = true; $('#login').hidden = false; }
  });
  state.client.auth.getSession().then(({ data }) => { if (data.session && !demarre) { demarre = true; demarrerSession(data.session); } else if (!data.session) { $('#l-email').focus(); } });
  if (location.hash.includes('error=')) { const p = new URLSearchParams(location.hash.slice(1)); msgLogin('err', 'Lien invalide ou expiré : ' + esc(p.get('error_description') || p.get('error'))); history.replaceState(null, '', location.pathname); }
  window.addEventListener('offline', () => setConn(false, 'Hors ligne'));
  window.addEventListener('online', () => setConn(true, 'En direct'));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && state.vue === 'discussions' && state.canal && state.moi) { renderFil(true); marquerLu(state.canal); } });
})();
